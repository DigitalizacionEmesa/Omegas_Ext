<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title data-translate-key="page_title_orders_menu">Menú de Pedidos - Almacén</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <!-- El header global se insertará automáticamente -->
  
  <div class="main-grid">
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Pedidos/Summary_Omegas.html'" style="display: flex; align-items: center; justify-content: center; cursor:pointer;">
      <div class="card-title" style="text-align: center; width: 100%;" data-translate-key="orders_summary_card">RESUMEN DE PEDIDOS</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Pedidos/Sequenced_Omegas.html'" style="display: flex; align-items: center; justify-content: center; cursor:pointer;">
      <div class="card-title" style="text-align: center; width: 100%;" data-translate-key="sequenced_orders_card">PEDIDOS SECUENCIADOS</div>
    </div>
  </div>

  <!-- SCRIPT DE VALIDACIÓN DE PERMISOS (NUEVO SISTEMA) -->
  <script>
    // ===== CÓDIGO DE VALIDACIÓN DE PERMISOS =====
    async function verificarPermisos() {
        try {
            // NUEVO SISTEMA: usar usuarioSGA (login modal)
            const usuarioActual = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
            
            if (!usuarioActual.id || !usuarioActual.nivel) {
                // El loginModal.js se encargará de mostrar el modal de login
                console.log('No hay sesión activa, esperando login...');
                return false;
            }
            
            const nivelUsuario = usuarioActual.nivel;
            
            console.log(`🔍 Verificando permisos - Usuario: ${usuarioActual.nombre}, Nivel: ${nivelUsuario}`);
            
            // Esta pantalla requiere nivel 5 (Pedidos)
            if (nivelUsuario < 5) {
                alert(`❌ Acceso denegado.\n\nNecesitas nivel 5 o superior para acceder a esta sección.\nTu nivel actual: ${nivelUsuario}`);
                window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
                return false;
            }
            
            console.log(`✅ Acceso permitido - Pantalla Principal Pedidos`);
            return true;
            
        } catch (error) {
            console.error('Error verificando permisos:', error);
            alert('Error al verificar permisos. Redirigiendo al inicio...');
            window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
            return false;
        }
    }

    // Ejecutar verificación al cargar la página o cuando el usuario se loguee
    document.addEventListener('DOMContentLoaded', () => {
      // Esperar a que el usuario esté logueado para verificar permisos
      window.addEventListener('userLoggedIn', verificarPermisos);
      // Si ya hay usuario, ejecutar directamente
      const usuario = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
      if (usuario.id) {
        verificarPermisos();
      }
    });
    // ===== FIN CÓDIGO DE VALIDACIÓN =====
  </script>

  <!-- ======================= INICIO DEL SCRIPT DE TRADUCCIÓN ======================= -->
  <script>
    let currentTranslations = {};

    function getTranslation(key) {
      return currentTranslations[key] || key;
    }

    function applyTranslations(translations) {
      currentTranslations = translations;
      document.querySelectorAll('[data-translate-key]').forEach(element => {
        const key = element.getAttribute('data-translate-key');
        if (translations[key]) element.innerHTML = translations[key];
      });
      document.querySelectorAll('[data-translate-key-title]').forEach(element => {
        const key = element.getAttribute('data-translate-key-title');
        if (translations[key]) element.setAttribute('title', translations[key]);
      });
      document.querySelectorAll('[data-translate-key-placeholder]').forEach(element => {
        const key = element.getAttribute('data-translate-key-placeholder');
        if (translations[key]) element.setAttribute('placeholder', translations[key]);
      });
    }

    async function loadTranslations(lang) {
      try {
        const fileName = `translation_${lang}.json`;
        const response = await fetch(`/translations/${fileName}`);
        
        if (!response.ok) {
          console.warn(`Traducción para '${lang}' no encontrada. Cargando 'es' como alternativa.`);
          if (lang !== 'es') await loadTranslations('es');
          return;
        }
        const translations = await response.json();
        applyTranslations(translations);
        document.documentElement.lang = lang;
        localStorage.setItem('language', lang);

        const selector = document.getElementById('language-selector');
        if (selector) selector.value = lang;

      } catch (error) {
        console.error("Error al cargar o aplicar las traducciones:", error);
      }
    }

    function changeLanguage(lang) {
      loadTranslations(lang);
    }

    // Cargar idioma inicial
    const preferredLanguage = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
    loadTranslations(preferredLanguage);
  </script>
  <!-- Header global (incluye login widget y selector de idioma) -->
  <script src="/assets/globalHeader.js" data-title="PEDIDOS" data-title-key="page_title_orders_menu"></script>
  <!-- ======================= FIN DEL SCRIPT DE TRADUCCIÓN ======================= -->
</body>
</html>
