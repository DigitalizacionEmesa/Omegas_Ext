<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">  <link rel="icon" href="/IMAGENES/favicon_omega.svg" type="image/svg+xml">    <title data-translate-key="page_title_missing_products">Productos Faltantes</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="stylesheet" href="/assets/loginModal.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Tus estilos originales se mantienen intactos */
        .productos-table-container{background:#fff;border-radius:10px;box-shadow:0 2px 8px #0001;padding:2rem;margin-top:2rem}
        .productos-table{width:100%;border-collapse:collapse}
        .productos-table th,.productos-table td{padding:.7rem 1rem;border-bottom:1px solid #e0e0e0;text-align:left}
        .productos-table th{background:#1976d2;color:#fff;position:sticky;top:0;z-index:2}
        .productos-table td{background-clip:padding-box}
        .productos-table tr:last-child td{border-bottom:none}
        .search-box{margin-bottom:1.5rem}
        tr.faltante{background:#ffe082!important}
        .switch{cursor:pointer}
        @media (max-width:700px){.productos-table-container{padding:.5rem}.productos-table th,.productos-table td{padding:.4rem .5rem;font-size:.95em}}
    </style>
</head>
<body>
    <!-- Header generado por globalHeader.js -->
    <main>
        <div class="productos-table-container">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:1em;">
                <div class="search-box">
                    <input type="text" id="search" placeholder="Buscar producto..." style="padding:8px 12px;border-radius:6px;border:1px solid #ccc;font-size:1rem;" data-translate-key-placeholder="placeholder_search_product">
                </div>
                <div style="display:flex;align-items:center;gap:.5em;">
                    <input type="checkbox" id="filter-faltantes" style="accent-color:#d32f2f;vertical-align:middle;">
                    <span style="display:inline-flex;align-items:center;gap:4px;font-size:.98em;">
                        <span style="display:inline-block;width:16px;height:16px;background:#ffe082;border-radius:3px;border:1px solid #e0b800;"></span>
                        <span data-translate-key="label_only_missing">Solo productos marcados como Faltante</span>
                    </span>
                </div>
            </div>
            <table class="productos-table">
                <thead>
                    <tr>
                        <th data-translate-key="table_header_code">Código</th>
                        <th data-translate-key="table_header_description">Descripción</th>
                        <th data-translate-key="table_header_missing">Faltante</th>
                    </tr>
                </thead>
                <tbody id="productos-tbody"></tbody>
            </table>
        </div>
    </main>

    <!-- ========= SCRIPT DE LÓGICA + TRADUCCIÓN (TODO JUNTO) ========= -->
    <script>
        // ===== CÓDIGO DE VALIDACIÓN DE PERMISOS =====
        async function verificarPermisos() {
            try {
                // Obtener datos del usuario desde localStorage
                const usuarioSGA = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
                
                if (!usuarioSGA.id || !usuarioSGA.nivel) {
                    console.log('No hay sesión activa, esperando login...');
                    return;
                }
                
                const nivelUsuario = usuarioSGA.nivel;
                
                console.log(`🔍 Verificando permisos - Usuario: ${usuarioSGA.nombre}, Nivel: ${nivelUsuario}`);
                
                // Esta pantalla requiere nivel 5 (Maestro)
                if (nivelUsuario < 5) {
                    alert(`❌ Acceso denegado.\n\nNecesitas nivel 5 (Maestro) para acceder a esta sección.\nTu nivel actual: ${nivelUsuario}`);
                    window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
                    return;
                }
                
                console.log(`✅ Acceso permitido - Productos Faltantes Master`);
                
            } catch (error) {
                console.error('Error verificando permisos:', error);
                alert('Error al verificar permisos. Redirigiendo al inicio...');
                window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
            }
        }

        // Ejecutar verificación al cargar la página
        document.addEventListener('DOMContentLoaded', verificarPermisos);
        
        // Escuchar evento de login exitoso
        window.addEventListener('userLoggedIn', verificarPermisos);
        // ===== FIN CÓDIGO DE VALIDACIÓN =====

        // --- Variables Globales ---
        let productos = [];

        // --- Funciones de Lógica de la Página ---
        async function cargarProductos() {
            try {
                const res = await fetch('/api/productos/all');
                const data = await res.json();
                if (!Array.isArray(data)) {
                    alert(`${getTranslation('alert_error_loading_products')} ${data.error || "Respuesta inesperada"}`);
                    productos = [];
                } else {
                    productos = data;
                }
                renderTabla();
            } catch (e) {
                alert(getTranslation('alert_connection_error'));
                productos = [];
                renderTabla();
            }
        }

        function renderTabla() {
            const filtro = (document.getElementById('search')?.value || '').toLowerCase();
            const soloFaltantes = document.getElementById('filter-faltantes')?.checked;
            const tbody = document.getElementById('productos-tbody');
            tbody.innerHTML = '';
            productos.filter(p => {
                const match = (p.Cod_producto || '').toLowerCase().includes(filtro) || (p.Descripcion || '').toLowerCase().includes(filtro);
                if (!match) return false;
                if (soloFaltantes && !p.Faltante) return false;
                return true;
            }).forEach(p => {
                const tr = document.createElement('tr');
                if (p.Faltante) tr.classList.add('faltante');
                tr.innerHTML = `
                    <td>${p.Cod_producto}</td>
                    <td>${p.Descripcion || ''}</td>
                    <td style="text-align:center;">
                        <input type="checkbox" class="switch" ${p.Faltante ? 'checked' : ''} onchange="toggleFaltante('${p.Cod_producto}', this.checked)">
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function toggleFaltante(cod, estado) {
            await fetch('/api/productos/faltante', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({Cod_producto: cod, Faltante: estado})
            });
            await cargarProductos();
        }

        function setupPageLogic() {
            document.getElementById('search')?.addEventListener('input', renderTabla);
            document.getElementById('filter-faltantes')?.addEventListener('change', renderTabla);
            cargarProductos();
        }

        // --- Funciones de Traducción y Carga Inicial ---

        let currentTranslations = {};

        function getTranslation(key) { return currentTranslations[key] || key; }

        function applyTranslations(translations) {
            currentTranslations = translations;
            document.querySelectorAll('[data-translate-key]').forEach(el => { if (translations[el.getAttribute('data-translate-key')]) el.innerHTML = translations[el.getAttribute('data-translate-key')]; });
            document.querySelectorAll('[data-translate-key-title]').forEach(el => { if (translations[el.getAttribute('data-translate-key-title')]) el.setAttribute('title', translations[el.getAttribute('data-translate-key-title')]); });
            document.querySelectorAll('[data-translate-key-placeholder]').forEach(el => { if (translations[el.getAttribute('data-translate-key-placeholder')]) el.setAttribute('placeholder', translations[el.getAttribute('data-translate-key-placeholder')]); });
        }

        async function loadTranslations(lang) {
            try {
                const response = await fetch(`/translations/translation_${lang}.json`);
                if (!response.ok) { if (lang !== 'es') await loadTranslations('es'); return; }
                const translations = await response.json();
                applyTranslations(translations);
                document.documentElement.lang = lang;
                localStorage.setItem('language', lang);
                // Sincronizar ambos selectores
                const selector = document.getElementById('language-selector');
                const headerSelector = document.getElementById('header-language-selector');
                if (selector) selector.value = lang;
                if (headerSelector) headerSelector.value = lang;
            } catch (error) { console.error("Error al cargar traducciones:", error); }
        }

        function changeLanguage(lang) {
            loadTranslations(lang).then(() => {
                if (typeof renderTabla === 'function') {
                    renderTabla();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
            loadTranslations(lang).then(() => {
                if (typeof setupPageLogic === 'function') {
                    setupPageLogic();
                }
            });
        });
    </script>
    <script src="/assets/globalHeader.js" data-title="Productos Faltantes" data-title-key="header_missing_products"></script>
</body>
</html>
