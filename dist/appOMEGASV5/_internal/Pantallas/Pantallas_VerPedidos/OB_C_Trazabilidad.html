<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/IMAGENES/favicon_omega.svg" type="image/svg+xml">
    <title data-translate-key="page_title_traceability_c">Trazabilidad C</title>
    <link rel="stylesheet" href="../../assets/styles.css">
    <link rel="stylesheet" href="/assets/loginModal.css">
</head>
<body>
  <!-- Header generado por globalHeader.js -->
  <div class="main-grid" id="cardsGrid" style="display: flex; flex-direction: column; gap: 28px; padding: 40px 0; max-width: 1200px; margin: 0 auto;">
    <!-- Cards se insertan por JS -->
  </div>

  <!-- SCRIPT DE LÓGICA DE LA PÁGINA (VERSIÓN MEJORADA) -->
  <script>
    // ===== CÓDIGO DE VALIDACIÓN DE PERMISOS =====
    async function verificarPermisos() {
        try {
            const usuarioSGA = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
            if (!usuarioSGA.id || !usuarioSGA.nivel) {
                console.log('No hay sesión activa, esperando login...');
                return;
            }
            const nivelUsuario = usuarioSGA.nivel;
            if (nivelUsuario < 1) {
                alert(`❌ Acceso denegado.\n\nNecesitas nivel 1 o superior.\nTu nivel actual: ${nivelUsuario}`);
                window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
                return;
            }
            console.log(`✅ Acceso permitido - OB C Trazabilidad`);
        } catch (error) {
            console.error('Error verificando permisos:', error);
            alert('Error al verificar permisos. Redirigiendo al inicio...');
            window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
        }
    }
    document.addEventListener('DOMContentLoaded', verificarPermisos);
    window.addEventListener('userLoggedIn', verificarPermisos);
    // ===== FIN CÓDIGO DE VALIDACIÓN =====
    
    let pedidosCache = [];
    let lastRenderedPedidosSignature = '';
    const beamWOCache = {}; // Mantenemos la caché para evitar parpadeos si no hay cambios

    function buildPedidosSignature(pedidos) {
      return JSON.stringify((pedidos || []).map(pedido => ({
        SalesOrder: pedido.SalesOrder || '',
        Sequence: pedido.Sequence || pedido.SequenceValue || '',
        Beam: pedido.Beam || '',
        Qty: pedido.Qty || 0,
        DoneQty: pedido.DoneQty ?? 0
      })));
    }

    function buildBarcodeUrl(value) {
      if (!value) return '';
      return `https://bwipjs-api.metafloor.com/?bcid=code39&text=${encodeURIComponent(value)}&scale=4&height=18`;
    }

    async function getPedidosSecuenciadosC() {
      try {
        const res = await fetch('/api/pedidos_secuenciados_c_trazabilidad');
        if (!res.ok) return [];
        return await res.json();
      } catch (error) {
        console.error("Error fetching sequenced orders:", error);
        return [];
      }
    }

    // --- NUEVA FUNCIÓN ---
    // Esta función se encarga de actualizar solo las WOs de las Beams que están en pantalla.
    async function actualizarWOsDeBeamsVisibles() {
        // 1. Identificar todas las Beams únicas que se están mostrando actualmente.
        const beamElements = document.querySelectorAll('[data-beam-code]');
        const uniqueBeams = new Set(Array.from(beamElements).map(el => el.dataset.beamCode));

        if (uniqueBeams.size === 0) return;

        // 2. Para cada Beam única, buscar sus WOs actualizadas.
        for (const beamCode of uniqueBeams) {
            try {
                const response = await fetch(`/api/beam_wo/${encodeURIComponent(beamCode)}`);
                const woList = await response.json();
                const normalizedWOList = Array.isArray(woList) ? woList : [];
                const previousWOList = beamWOCache[beamCode] || [];
                
                const woContainers = document.querySelectorAll(`[data-wo-container-for="${beamCode}"]`);
                const barcodeImages = document.querySelectorAll(`[data-barcode-for="${beamCode}"]`);

                const recentWO = normalizedWOList.slice(0, 3).join(', ') || '-';
                const firstWO = normalizedWOList.length > 0 ? normalizedWOList[0] : '';
                const previousRecentWO = previousWOList.slice(0, 3).join(', ') || '-';
                const previousFirstWO = previousWOList.length > 0 ? previousWOList[0] : '';

                beamWOCache[beamCode] = normalizedWOList;
                
                if (recentWO !== previousRecentWO) {
                  woContainers.forEach(container => {
                    if (container.textContent !== recentWO) {
                      container.textContent = recentWO;
                    }
                  });
                }
                
                if (firstWO !== previousFirstWO) {
                  const barcodeUrl = buildBarcodeUrl(firstWO);
                  barcodeImages.forEach(img => {
                    if ((img.dataset.barcodeValue || '') !== firstWO) {
                      img.dataset.barcodeValue = firstWO;
                      img.src = barcodeUrl;
                    }
                  });
                }

            } catch (error) {
                console.error(`Error actualizando WOs para Beam ${beamCode}:`, error);
            }
        }
    }

    function renderCards(pedidos, options = {}) {
      const { force = false } = options;
      const sorted = Array.isArray(pedidos) ? [...pedidos] : [];
      const nextSignature = buildPedidosSignature(sorted);

      if (!force && nextSignature === lastRenderedPedidosSignature) {
        return;
      }

      lastRenderedPedidosSignature = nextSignature;
      pedidosCache = sorted;
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      if (!sorted.length) {
        grid.innerHTML = `<div style="text-align:center;color:#3456a1;margin-top:40px;">${getTranslation('text_no_c_orders')}</div>`;
        return;
      }
      
      sorted.forEach((pedido, idx) => {
        const card = document.createElement('div');
        card.className = 'secuenciacion-card';
        card.style = `background: #f4f8ff; border-radius: 22px; box-shadow: 0 8px 32px rgba(0,91,170,0.18); display: flex; flex-direction: column; gap: 0; padding: 0; min-height: 260px; font-size: 1.5rem; font-weight: 600; position:relative; border-left: 14px solid #1976d2; margin: 0; width: 100%; max-width: 1700px;`;
        const cachedWOList = beamWOCache[pedido.Beam || ''] || [];
        const recentWO = cachedWOList.slice(0, 3).join(', ') || 'Cargando...';
        const firstWO = cachedWOList.length > 0 ? cachedWOList[0] : '';
        const barcodeUrl = buildBarcodeUrl(firstWO);
        
        // --- HTML MODIFICADO ---
        // Se añaden atributos 'data-*' para poder seleccionar y actualizar estos elementos fácilmente.
        card.innerHTML = `
          <div style="background:#1976d2;color:white;padding:28px 48px 18px 48px;border-radius:10px 22px 0 0;display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:2.2rem;font-weight:700;letter-spacing:2px;">${getTranslation('card_label_sequence')} ${pedido.Sequence || ''}</span>
            <span style="font-size:2rem;font-weight:600;">${getTranslation('card_label_order')} ${pedido.SalesOrder || ''}</span>
          </div>
          <div style="display:flex;flex-wrap:nowrap;gap:38px;padding:28px 64px 0 64px;justify-content:center;">
            <div class="pedido-info-container pedido-info-top">
                <span>${getTranslation('table_header_beam')}</span>
                <div data-beam-code="${pedido.Beam || ''}">${pedido.Beam || ''}</div>
            </div>
            <div class="pedido-info-container pedido-info-top">
                <span>${getTranslation('card_label_wo_beam')}</span>
                <div data-wo-container-for="${pedido.Beam || ''}">${recentWO}</div>
            </div>
          </div>
          <div style="display:flex;flex-wrap:nowrap;gap:38px;padding:18px 64px 38px 64px;justify-content:center;align-items:center;">
            <div class="pedido-info-container pedido-info-bottom"><span>${getTranslation('card_label_qty')}</span><div>${pedido.Qty || ''}</div></div>
            <div class="pedido-info-container pedido-info-bottom"><span>${getTranslation('card_label_done_qty')}</span><div>${(pedido.DoneQty === 0 || pedido.DoneQty === '0' || pedido.DoneQty === null || pedido.DoneQty === undefined || pedido.DoneQty === '') ? 0 : pedido.DoneQty}</div></div>
            <div class="pedido-info-container pedido-info-bottom" style="background:#fff;min-width:260px;max-width:320px;width:100%;height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:auto;box-shadow:0 2px 8px rgba(0,0,0,0.08);border:2px solid #1976d2;">
              <span style="font-size:1.35rem;color:#1976d2;font-weight:700;margin-bottom:8px;letter-spacing:1px;">${getTranslation('barcode_label')}</span>
              <div style="width:320px;height:90px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff;">
                <img data-barcode-for="${pedido.Beam || ''}" data-barcode-value="${firstWO}" style="height:90px;width:420px;object-position:center;display:block;background:#fff;padding:0 8px;" alt="barcode" src="${barcodeUrl}" />
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      // Después de renderizar todas las tarjetas, actualizamos las WOs por primera vez.
      actualizarWOsDeBeamsVisibles();
    }

    async function autoUpdatePedidosSecuenciadosC() {
      const pedidos = await getPedidosSecuenciadosC();
      renderCards(pedidos);
    }
    
    // --- FUNCIÓN DE INICIO MODIFICADA ---
    function setupPageLogic() {
        // Llama a la función que actualiza la lista de pedidos cada 5 segundos
        autoUpdatePedidosSecuenciadosC();
        setInterval(autoUpdatePedidosSecuenciadosC, 5000);

        // Llama a la NUEVA función que actualiza solo las WOs de las Beams cada 5.5 segundos
        // Se usa un pequeño desfase (5.5s vs 5s) para evitar que todas las llamadas se hagan al mismo tiempo.
        setInterval(actualizarWOsDeBeamsVisibles, 5500); 
    }
  </script>

  <!-- ESTILOS ADICIONALES -->
  <style>
    .pedido-info-container{align-self:center;background:#fff;border:2.5px solid #e3eafc;border-radius:14px;min-width:180px;max-width:200px;height:160px;margin:0;display:flex;flex-direction:column;padding:6px;align-items:center;box-shadow:0 4px 16px rgba(0,91,170,.1);font-size:1.5rem;font-weight:600;flex-shrink:1}.pedido-info-top{font-size:1.5rem}.pedido-info-bottom{font-size:2rem}.pedido-info-container span{color:#1976d2;font-weight:700;font-size:1.8rem;margin-bottom:10px;letter-spacing:2px}.pedido-info-container div{color:#3456a1;font-size:1.6rem;font-weight:700;letter-spacing:1px;text-align:center}.secuenciacion-card{transition:box-shadow .2s,border-color .2s;display:flex;flex-direction:column}.secuenciacion-card:hover{box-shadow:0 8px 32px rgba(0,91,170,.22);border-left:10px solid #005baa}
    .main-grid{display:flex;flex-direction:column;gap:clamp(16px,4vw,28px);padding:clamp(20px,5vh,40px) clamp(8px,3vw,30px);max-width:100%;margin:0 auto}
    @media (max-width:1200px){.pedido-info-container{min-width:160px;max-width:180px;height:150px}.pedido-info-top{font-size:1.3rem}.pedido-info-bottom{font-size:1.8rem}}
    @media (max-width:1024px){.pedido-info-container{min-width:140px;max-width:160px;height:145px;font-size:1.2rem}.pedido-info-container span{font-size:1.5rem;margin-bottom:8px}.pedido-info-container div{font-size:1.4rem}}
    @media (max-width:768px){.main-grid{gap:18px;padding:18px 12px}.pedido-info-container{min-width:120px;max-width:140px;height:135px;font-size:1rem;padding:5px}.pedido-info-container span{font-size:1.2rem;margin-bottom:6px}.pedido-info-container div{font-size:1.1rem}.pedido-info-top{font-size:1.2rem}.pedido-info-bottom{font-size:1.5rem}}
    @media (max-width:600px){.main-grid{gap:15px;padding:15px 10px}.pedido-info-top{font-size:1rem}.pedido-info-bottom{font-size:1.2rem}.pedido-info-container{min-width:100px;max-width:130px;height:120px;padding:4px;font-size:0.9rem}.pedido-info-container span{font-size:1rem;margin-bottom:4px;letter-spacing:1px}.pedido-info-container div{font-size:0.95rem}}
    @media (max-width:480px){.main-grid{gap:12px;padding:10px 8px}.pedido-info-container{min-width:90px;max-width:110px;height:110px;font-size:0.8rem;padding:3px}.pedido-info-container span{font-size:0.9rem;margin-bottom:3px}.pedido-info-container div{font-size:0.85rem}}
    @media (max-width:360px){.pedido-info-top{font-size:0.8rem}.pedido-info-bottom{font-size:1rem}.pedido-info-container{min-width:80px;max-width:100px;height:100px;font-size:0.75rem;padding:2px}.pedido-info-container span{font-size:0.75rem;margin-bottom:2px}.pedido-info-container div{font-size:0.7rem}}
  </style>

  <!-- ======================= INICIO DEL SCRIPT DE TRADUCCIÓN ======================= -->
  <script>
      
      let currentTranslations = {};
      function getTranslation(key) { return currentTranslations[key] || key; }
      function applyTranslations(translations) {
          currentTranslations = translations;
          document.querySelectorAll('[data-translate-key]').forEach(el => { if (translations[el.getAttribute('data-translate-key')]) el.innerHTML = translations[el.getAttribute('data-translate-key')]; });
          document.querySelectorAll('[data-translate-key-title]').forEach(el => { if (translations[el.getAttribute('data-translate-key-title')]) el.setAttribute('title', translations[el.getAttribute('data-translate-key-title')]); });
      }
      async function loadTranslations(lang) {
          try {
              const response = await fetch(`/translations/translation_${lang}.json`);
              if (!response.ok) { if (lang !== 'es') await loadTranslations('es'); return; }
              const translations = await response.json();
              applyTranslations(translations);
              document.documentElement.lang = lang;
              localStorage.setItem('language', lang);
              // Sincronizar ambos selectores
              const selector = document.getElementById('language-selector');
              const headerSelector = document.getElementById('header-language-selector');
              if (selector) selector.value = lang;
              if (headerSelector) headerSelector.value = lang;
          } catch (error) { console.error("Error al cargar traducciones:", error); }
      }
      function changeLanguage(lang) {
          loadTranslations(lang).then(() => {
              // Re-renderizar las tarjetas con el nuevo idioma
              if (typeof renderCards === 'function' && typeof pedidosCache !== 'undefined') {
              renderCards(pedidosCache, { force: true });
              }
          });
      }
      document.addEventListener('DOMContentLoaded', () => {
          const lang = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
          loadTranslations(lang).then(() => {
              if (typeof setupPageLogic === 'function') {
                  setupPageLogic();
              }
          });
      });
  </script>
  <script src="/assets/globalHeader.js" data-title="TRAZABILIDAD C" data-title-key="header_trazability_orders_c"></script>
  <!-- ======================= FIN DEL SCRIPT DE TRADUCCIÓN ======================= -->
</body>
</html>
