<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate-key="page_title">Pantalla de Inicio - Almacén</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <!-- ======================= HEADER CON GLOBAL HEADER ======================= -->
  <script src="/assets/globalHeader.js" data-title="ALMACÉN"></script>
  <!-- ================================================================ -->

  <!-- Selector de idioma en una barra secundaria -->
  <div style="background: #f5f5f5; padding: 10px; text-align: right;">
    <label for="language-selector" style="margin-right: 10px; font-weight: 600;">Idioma:</label>
    <select id="language-selector" onchange="changeLanguage(this.value)" style="padding: 5px 10px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer;">
      <option value="es">ES</option>
      <option value="en">EN</option>
      <option value="cz">CZ</option>
    </select>
  </div>

  <style>
    .main-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
      max-width: 900px;
      margin: 38px auto 0 auto;
      width: 96%;
    }
    @media (max-width: 700px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
    .card {
      background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
    }
    .card.full-width {
      grid-column: 1 / -1;
      min-height: 110px;
      font-size: 2rem;
    }
    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #1976d2;
      text-align: center;
      width: 100%;
    }
    .card.full-width .card-title {
      font-size: 2rem;
    }
  </style>
  
  <div class="main-grid">
    <div class="card full-width" onclick="window.location.href='/Pantallas/Pantallas_VerPedidos/VerPedidos.html'">
      <div class="card-title" data-translate-key="view_orders">VER PEDIDOS</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Omegas/Pantalla_General_omegas.html'">
      <div class="card-title" data-translate-key="stock_omegas">STOCK OMEGAS</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Maestro/Pantalla_General_Maestro.html'">
      <div class="card-title" data-translate-key="master_omegas">MAESTRO MATERIALES</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Pedidos/Pantalla_principal_Pedidos.html'">
      <div class="card-title" data-translate-key="order_sequencing">SECUENCIACIÓN PEDIDOS</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Reportes/Pantalla_principal_reportes.html'">
      <div class="card-title" data-translate-key="card_view_reports">VER REPORTES</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Configuración/scrCambiarPassword.html'">
      <div class="card-title" data-translate-key="change_password">CAMBIAR CONTRASEÑA</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Configuración/Gestion_Permisos.html'">
      <div class="card-title" data-translate-key="config_permissions">CONFIGURACIÓN</div>
    </div>
  </div>

  <!-- ======================= SISTEMA DE TRADUCCIÓN ======================= -->
  <script>
    let currentTranslations = {};

    function applyTranslations(translations) {
      currentTranslations = translations;
      document.querySelectorAll('[data-translate-key]').forEach(element => {
        const key = element.getAttribute('data-translate-key');
        if (translations[key]) {
          element.innerHTML = translations[key];
        }
      });
      document.querySelectorAll('[data-translate-key-title]').forEach(element => {
        const key = element.getAttribute('data-translate-key-title');
        if (translations[key]) {
          element.setAttribute('title', translations[key]);
        }
      });
    }

    async function loadTranslations(lang) {
      try {
        const fileName = `translation_${lang}.json`;
        const response = await fetch(`/translations/${fileName}`);
        if (!response.ok) {
          console.error(`Error cargando traducciones: ${response.status}`);
          return;
        }
        const translations = await response.json();
        applyTranslations(translations);
        document.documentElement.lang = lang;
      } catch (error) {
        console.error('Error al cargar traducciones:', error);
      }
    }

    function changeLanguage(lang) {
      localStorage.setItem('language', lang);
      loadTranslations(lang);
    }

    // Cargar idioma guardado o usar español por defecto
    window.addEventListener('DOMContentLoaded', () => {
      const savedLanguage = localStorage.getItem('language') || 'es';
      document.getElementById('language-selector').value = savedLanguage;
      loadTranslations(savedLanguage);
    });
  </script>

  <!-- ======================= SCRIPTS DEL SISTEMA DE LOGIN ======================= -->
  <script src="/assets/loginModal.js"></script>
  <script src="/assets/sharedSession.js"></script>
</body>
</html>
