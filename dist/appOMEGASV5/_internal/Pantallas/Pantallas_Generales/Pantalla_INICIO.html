<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/IMAGENES/favicon_omega.svg" type="image/svg+xml">
  <title data-translate-key="page_title">Pantalla de Inicio - Almacén</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <!-- El header global se insertará automáticamente al final del script -->

  <style>
    .main-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
      max-width: 900px;
      margin: 38px auto 0 auto;
      width: 96%;
    }
    @media (max-width: 700px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
    .card.full-width {
      grid-column: 1 / -1;
      min-height: 110px;
      font-size: 2rem;
    }
  </style>
  <div class="main-grid">
    <div class="card full-width" onclick="window.location.href='/Pantallas/Pantallas_VerPedidos/VerPedidos.html'" style="display: flex; align-items: center; justify-content: center; cursor:pointer; grid-column: 1 / -1;">
      <div class="card-title" style="text-align: center; width: 100%;" data-translate-key="view_orders">VER PEDIDOS</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Omegas/Pantalla_General_omegas.html'" style="display: flex; align-items: center; justify-content: center;">
      <div class="card-title" style="text-align: center; width: 100%;" data-translate-key="stock_omegas">STOCK OMEGAS</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Maestro/Pantalla_General_Maestro.html'" style="display: flex; align-items: center; justify-content: center; cursor:pointer;">
      <div class="card-title" style="text-align: center; width: 100%;" data-translate-key="master_omegas">MAESTRO MATERIALES</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Pedidos/Pantalla_principal_Pedidos.html'" style="display: flex; align-items: center; justify-content: center;">
      <div class="card-title" style="text-align: center; width: 100%;" data-translate-key="order_sequencing">SECUENCIACIÓN PEDIDOS</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Reportes/Pantalla_principal_reportes.html'" style="display: flex; align-items: center; justify-content: center;">
      <div class="card-title" style="text-align: center; width: 100%;" data-translate-key="card_view_reports">VER REPORTES</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Configuración/Gestion_Permisos.html'" style="display: flex; align-items: center; justify-content: center;">
      <div class="card-title" style="text-align: center; width: 100%;" data-translate-key="config_permissions">CONFIG</div>
    </div>
  </div>

  <!-- Los botones de idioma de aquí abajo han sido eliminados -->


  <!-- ======================= INICIO DEL SCRIPT DE TRADUCCIÓN ======================= -->
  <script>
    
    let currentTranslations = {};

    function applyTranslations(translations) {
      currentTranslations = translations;
      document.querySelectorAll('[data-translate-key]').forEach(element => {
        const key = element.getAttribute('data-translate-key');
        if (translations[key]) {
          element.innerHTML = translations[key];
        }
      });
      document.querySelectorAll('[data-translate-key-title]').forEach(element => {
        const key = element.getAttribute('data-translate-key-title');
        if (translations[key]) {
          element.setAttribute('title', translations[key]);
        }
      });
    }

    async function loadTranslations(lang) {
      try {
        const fileName = `translation_${lang}.json`;
        const response = await fetch(`/translations/${fileName}`);
        
        if (!response.ok) {
          console.warn(`Traducción para '${lang}' no encontrada. Cargando 'es' como alternativa.`);
          if (lang !== 'es') {
            await loadTranslations('es');
          }
          return;
        }
        const translations = await response.json();
        applyTranslations(translations);
        document.documentElement.lang = lang;
        localStorage.setItem('language', lang);

        // Sincroniza todos los selectores de idioma
        const selectors = ['language-selector', 'header-language-selector'];
        selectors.forEach(id => {
          const selector = document.getElementById(id);
          if (selector) selector.value = lang;
        });

      } catch (error) {
        console.error("Error al cargar o aplicar las traducciones:", error);
      }
    }

    // Esta función es llamada por el evento onchange del <select>
    function changeLanguage(lang) {
      loadTranslations(lang);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const preferredLanguage = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
      loadTranslations(preferredLanguage);
    });

    function checkConfigPermission() {
      const user = { role: 'user' };
      if (user && user.role === 'admin') {
        window.location.href = '/Pantallas/Pantallas_Configuración/Configurar_Estanterias.html';
      } else {
        const message = currentTranslations['permission_denied'] || 'No tienes permisos para acceder a la configuración de estanterias.';
        alert(message);
      }
    }
  </script>
  <!-- ======================= FIN DEL SCRIPT DE TRADUCCIÓN ======================= -->
  
  <!-- ======================= CARGAR HEADER GLOBAL AL FINAL ======================= -->
  <script src="/assets/globalHeader.js" data-title="ALMACÉN" data-title-key="page_title"></script>
</body>
</html>
