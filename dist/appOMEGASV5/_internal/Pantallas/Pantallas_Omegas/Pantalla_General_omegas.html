<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/IMAGENES/favicon_omega.svg" type="image/svg+xml">
  <title data-translate-key="page_title_omegas">Pantalla General Omegas</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/loginModal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #eaf3fc; margin: 0; }
    .omegas-main-container {
      max-width: 700px; width: 96%; margin: 38px auto 0 auto; background: #fff;
      border-radius: 12px; box-shadow: 0 2px 12px #1976d222; padding: 32px 32px 28px 32px;
      display: flex; flex-direction: column; align-items: center;
    }
    .omegas-btn-row {
      display: flex; flex-direction: row; gap: 32px; justify-content: center; margin-top: 32px;
    }
    .omegas-btn {
      background: #1976d2; color: #fff; border: none; border-radius: 10px; padding: 24px 38px;
      font-size: 1.35rem; font-weight: 700; cursor: pointer; transition: background 0.2s;
      box-shadow: 0 2px 8px 0 rgba(25,118,210,0.10); display: flex; align-items: center; gap: 14px;
    }
    .omegas-btn:hover { background: #1251a3; }
    @media (max-width: 700px) {
      .omegas-main-container { padding: 0 6px 18px 6px; }
      .omegas-btn { font-size: 1.05rem; padding: 16px 10px; }
    }
  </style>
</head>
<body>
  <!-- El header global se insertará automáticamente -->
  
  <div class="omegas-main-container">
    <div class="omegas-btn-row">
      <button class="omegas-btn" onclick="window.location.href='/Pantallas/Pantallas_Omegas/Reset_omegas.html'">
        <i class="bi bi-arrow-left-right"></i>
        <span data-translate-key="reset_omegas_button">Reset Assembled Omegas </span>
      </button>
      <button class="omegas-btn" onclick="window.location.href='/Pantallas/Pantallas_Omegas/Stock_Omegas.html'">
        <i class="bi bi-box-seam"></i>
        <span data-translate-key="stock_omegas_button">Stock Assembled Omegas</span>
      </button>
    </div>
  </div>
  <div class="omegas-main-container">
    <div class="omegas-btn-row">
      <button class="omegas-btn" onclick="window.location.href='/Pantallas/Pantallas_Omegas/Reset_Trazabilidad.html'">
        <i class="bi bi-arrow-left-right"></i>
        <span data-translate-key="reset_traceability_button">Reset Trazabilidad</span>
      </button>
      <button class="omegas-btn" onclick="window.location.href='/Pantallas/Pantallas_Omegas/Stock_Trazabilidad.html'">
        <i class="bi bi-box-seam"></i>
        <span data-translate-key="stock_traceability_button">Stock Trazabilidad</span>
      </button>
    </div>
  </div>

  <!-- ======================= INICIO DEL SCRIPT ======================= -->
  <script>
    // ===== CÓDIGO DE VALIDACIÓN DE PERMISOS (NUEVO SISTEMA) =====
    async function verificarPermisos() {
        try {
            // NUEVO SISTEMA: usar usuarioSGA (login modal)
            const usuarioActual = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
            
            if (!usuarioActual.id || !usuarioActual.nivel) {
                // El loginModal.js se encargará de mostrar el modal de login
                console.log('No hay sesión activa, esperando login...');
                return false;
            }
            
            const nivelUsuario = usuarioActual.nivel;
            
            console.log(`🔍 Verificando permisos - Usuario: ${usuarioActual.nombre}, Nivel: ${nivelUsuario}`);
            
            // Esta pantalla requiere nivel 5 (Omegas)
            if (nivelUsuario < 5) {
                alert(`❌ Acceso denegado.\n\nNecesitas nivel 5 o superior para acceder a esta sección.\nTu nivel actual: ${nivelUsuario}`);
                window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
                return false;
            }
            
            console.log(`✅ Acceso permitido - Pantalla General Omegas`);
            return true;
            
        } catch (error) {
            console.error('Error verificando permisos:', error);
            alert('Error al verificar permisos. Redirigiendo al inicio...');
            window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
            return false;
        }
    }

    // Ejecutar verificación cuando el usuario se loguee
    document.addEventListener('DOMContentLoaded', () => {
      // Esperar a que el usuario esté logueado para verificar permisos
      window.addEventListener('userLoggedIn', verificarPermisos);
      // Si ya hay usuario, ejecutar directamente
      const usuario = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
      if (usuario.id) {
        verificarPermisos();
      }
    });
    // ===== FIN CÓDIGO DE VALIDACIÓN =====

    let currentTranslations = {};

    function applyTranslations(translations) {
      currentTranslations = translations;
      document.querySelectorAll('[data-translate-key]').forEach(element => {
        const key = element.getAttribute('data-translate-key');
        if (translations[key]) {
          element.innerHTML = translations[key];
        }
      });
      document.querySelectorAll('[data-translate-key-title]').forEach(element => {
        const key = element.getAttribute('data-translate-key-title');
        if (translations[key]) {
          element.setAttribute('title', translations[key]);
        }
      });
    }

    async function loadTranslations(lang) {
      try {
        const fileName = `translation_${lang}.json`;
        const response = await fetch(`/translations/${fileName}`);
        
        if (!response.ok) {
          console.warn(`Traducción para '${lang}' no encontrada. Cargando 'es' como alternativa.`);
          if (lang !== 'es') {
            await loadTranslations('es');
          }
          return;
        }
        const translations = await response.json();
        applyTranslations(translations);
        document.documentElement.lang = lang;
        localStorage.setItem('language', lang);

        // Sincroniza todos los selectores de idioma
        const selectors = ['language-selector', 'header-language-selector'];
        selectors.forEach(id => {
          const selector = document.getElementById(id);
          if (selector) selector.value = lang;
        });

      } catch (error) {
        console.error("Error al cargar o aplicar las traducciones:", error);
      }
    }

    function changeLanguage(lang) {
      loadTranslations(lang);
    }

    // Cargar idioma inicial
    const preferredLanguage = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
    loadTranslations(preferredLanguage);
  </script>
  <!-- Header global (incluye login widget y selector de idioma) -->
  <script src="/assets/globalHeader.js" data-title="GESTIÓN OMEGAS" data-title-key="omegas_management_title"></script>
  <!-- ======================= FIN DEL SCRIPT ======================= -->
</body>
</html>
