<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/IMAGENES/favicon_omega.svg" type="image/svg+xml">
  <title data-translate-key="page_title_change_password">Cambiar contraseña</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/loginModal.css">
  <style>
    .cambiar-main { margin-top: 30px; }
  </style>
</head>
<body>
  <!-- El header global se insertará automáticamente -->
  
  <form class="cambiar-main" id="formCambiar">
    <div class="cambiar-grid">
      <div class="cambiar-row">
        <label class="cambiar-label" for="usuario" data-translate-key="label_user">Usuario</label>
        <input class="cambiar-input" id="usuario" name="usuario" placeholder="Ingrese su nombre de usuario" autocomplete="username" data-translate-key-placeholder="placeholder_user" readonly>
      </div>
      <div class="cambiar-row">
        <label class="cambiar-label" for="actual" data-translate-key="label_current_password">Contraseña actual</label>
        <input class="cambiar-input" id="actual" name="actual" type="password" placeholder="Ingrese su contraseña actual" autocomplete="current-password" data-translate-key-placeholder="placeholder_current_password">
      </div>
      <div class="cambiar-row">
        <label class="cambiar-label" for="nueva" data-translate-key="label_new_password">Nueva contraseña</label>
        <input class="cambiar-input" id="nueva" name="nueva" type="password" placeholder="Ingrese su nueva contraseña" autocomplete="new-password" data-translate-key-placeholder="placeholder_new_password">
        <div class="password-strength" style="height:4px;background:#e0e0e0;border-radius:2px;margin-top:8px;">
          <div id="passwordStrengthBar" class="password-strength-bar" style="height:100%;width:0;border-radius:2px;transition:width 0.3s ease,background 0.3s ease;"></div>
        </div>
      </div>
      <div class="cambiar-row">
        <label class="cambiar-label" for="confirmar" data-translate-key="label_confirm_password">Confirmar contraseña</label>
        <input class="cambiar-input" id="confirmar" name="confirmar" type="password" placeholder="Ingrese su nueva contraseña" autocomplete="new-password" data-translate-key-placeholder="placeholder_new_password">
      </div>
    </div>
    <div class="cambiar-footer">
      <span class="cambiar-msg" id="msg" data-translate-key="msg_fill_all_fields">Debes rellenar todos los campos</span>
      <button class="cambiar-btn" id="btnCambiar" type="submit" disabled data-translate-key="button_update_password">Actualizar contraseña</button>
    </div>
  </form>
  
  <script>
    // ===== CÓDIGO DE VALIDACIÓN DE PERMISOS (NUEVO SISTEMA) =====
    async function verificarPermisos() {
        try {
            // NUEVO SISTEMA: usar usuarioSGA (login modal)
            const usuarioActual = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
            
            if (!usuarioActual.id || !usuarioActual.nivel) {
                // El loginModal.js se encargará de mostrar el modal de login
                console.log('No hay sesión activa, esperando login...');
                return false;
            }
            
            const nivelUsuario = usuarioActual.nivel;
            
            console.log(`🔍 Verificando permisos - Usuario: ${usuarioActual.nombre}, Nivel: ${nivelUsuario}`);
            
            // Cambiar contraseña disponible para todos los usuarios autenticados
            
            console.log(`✅ Acceso permitido - Cambiar Password`);
            
            // Rellenar automáticamente el campo usuario
            document.getElementById('usuario').value = usuarioActual.num_operario || usuarioActual.nombre;
            
            // Una vez verificados los permisos, configurar la lógica de la página
            setupPageLogic();
            
            return true;
            
        } catch (error) {
            console.error('Error verificando permisos:', error);
            alert('Error al verificar permisos. Redirigiendo al inicio...');
            window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
            return false;
        }
    }

    // Ejecutar verificación cuando el usuario se loguee
    document.addEventListener('DOMContentLoaded', () => {
      // Esperar a que el usuario esté logueado para verificar permisos
      window.addEventListener('userLoggedIn', verificarPermisos);
      // Si ya hay usuario, ejecutar directamente
      const usuario = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
      if (usuario.id) {
        verificarPermisos();
      }
    });
    // ===== FIN CÓDIGO DE VALIDACIÓN =====
    
    // ===== INDICADOR DE FUERZA DE CONTRASEÑA =====
    function updatePasswordStrength() {
        const password = document.getElementById('nueva').value;
        const strengthBar = document.getElementById('passwordStrengthBar');
        
        let strength = 0;
        if (password.length >= 6) strength++;
        if (password.length >= 10) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;
        
        strengthBar.style.width = '0';
        strengthBar.style.background = '#e0e0e0';
        
        if (strength <= 2) {
            strengthBar.style.width = '33%';
            strengthBar.style.background = '#dc3545';
        } else if (strength <= 4) {
            strengthBar.style.width = '66%';
            strengthBar.style.background = '#ffc107';
        } else {
            strengthBar.style.width = '100%';
            strengthBar.style.background = '#28a745';
        }
    }

    function setupPageLogic() {
        const form = document.getElementById('formCambiar');
        const usuario = document.getElementById('usuario');
        const actual = document.getElementById('actual');
        const nueva = document.getElementById('nueva');
        const confirmar = document.getElementById('confirmar');
        const btnCambiar = document.getElementById('btnCambiar');
        const msg = document.getElementById('msg');
        
        // Añadir listener para indicador de fuerza
        nueva.addEventListener('input', updatePasswordStrength);

        function checkFields() {
            if (!usuario.value || !actual.value || !nueva.value || !confirmar.value) {
                btnCambiar.disabled = true;
                btnCambiar.classList.remove('enabled');
                msg.textContent = getTranslation('msg_fill_all_fields');
                return;
            }
            btnCambiar.disabled = false;
            btnCambiar.classList.add('enabled');
            msg.textContent = '';
        }

        actual.addEventListener('input', checkFields);
        nueva.addEventListener('input', checkFields);
        confirmar.addEventListener('input', checkFields);
        checkFields(); // Llamada inicial para establecer el estado

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!usuario.value || !actual.value || !nueva.value || !confirmar.value) {
                msg.textContent = getTranslation('msg_fill_all_fields');
                return;
            }
            if (nueva.value !== confirmar.value) {
                msg.textContent = getTranslation('msg_passwords_no_match');
                return;
            }
            btnCambiar.disabled = true;
            btnCambiar.classList.remove('enabled');
            msg.textContent = getTranslation('msg_processing');
            try {
                const response = await fetch('/api/cambiar_password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario: usuario.value, actual: actual.value, nueva: nueva.value })
                });
                let data = { message: getTranslation('msg_update_error') };
                try { data = await response.json(); } catch {}

                if (!response.ok) {
                    msg.textContent = data.message || getTranslation('msg_update_error');
                    btnCambiar.disabled = false;
                    btnCambiar.classList.add('enabled');
                    return;
                }

                if (data.success) {
                    msg.textContent = getTranslation('msg_update_success');
                    // Cerrar sesión y recargar la página para que vuelva a pedir login
                    localStorage.removeItem('usuarioSGA');
                    setTimeout(() => { window.location.reload(); }, 1500);
                } else {
                    msg.textContent = data.message || getTranslation('msg_update_error');
                    btnCambiar.disabled = false;
                    btnCambiar.classList.add('enabled');
                }
            } catch (err) {
                msg.textContent = getTranslation('msg_connection_error');
                btnCambiar.disabled = false;
                btnCambiar.classList.add('enabled');
            }
        });
    }
  </script>

  <!-- ======================= INICIO DEL SCRIPT DE TRADUCCIÓN ======================= -->
  <script>
      let currentTranslations = {};
      function getTranslation(key) { return currentTranslations[key] || key; }
      function applyTranslations(translations) {
          currentTranslations = translations;
          document.querySelectorAll('[data-translate-key]').forEach(el => { if (translations[el.getAttribute('data-translate-key')]) el.innerHTML = translations[el.getAttribute('data-translate-key')]; });
          document.querySelectorAll('[data-translate-key-title]').forEach(el => { if (translations[el.getAttribute('data-translate-key-title')]) el.setAttribute('title', translations[el.getAttribute('data-translate-key-title')]); });
          document.querySelectorAll('[data-translate-key-placeholder]').forEach(el => { if (translations[el.getAttribute('data-translate-key-placeholder')]) el.setAttribute('placeholder', translations[el.getAttribute('data-translate-key-placeholder')]); });
      }
      async function loadTranslations(lang) {
          try {
              const response = await fetch(`/translations/translation_${lang}.json`);
              if (!response.ok) { if (lang !== 'es') await loadTranslations('es'); return; }
              const translations = await response.json();
              applyTranslations(translations);
              document.documentElement.lang = lang;
              localStorage.setItem('language', lang);
              const selector = document.getElementById('language-selector');
              if (selector) selector.value = lang;
          } catch (error) { console.error("Error al cargar traducciones:", error); }
      }
      function changeLanguage(lang) {
          loadTranslations(lang);
      }
      // Cargar idioma inicial
      const lang = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
      loadTranslations(lang);
  </script>
  <!-- Header global (incluye login widget y selector de idioma) -->
  <script src="/assets/globalHeader.js" data-title="Cambiar Contraseña" data-title-key="header_change_password"></script>
  <!-- ======================= FIN DEL SCRIPT DE TRADUCCIÓN ======================= -->
</body>
</html>
