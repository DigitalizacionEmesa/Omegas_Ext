<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/IMAGENES/favicon_omega.svg" type="image/svg+xml">
  <title data-translate-key="page_title_orders_menu">Reports - Wharehouse</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/loginModal.css">
</head>
<body>
  <div class="header">
    <button class="home-icon" onclick="window.location.href='/Pantallas/Pantallas_Generales/Pantalla_INICIO.html'" title="Inicio" data-translate-key-title="home_tooltip">
      <svg viewBox="0 0 32 32"><path d="M4 14.5L16 5l12 9.5V27a2 2 0 0 1-2 2h-6v-7h-8v7H6a2 2 0 0 1-2-2V14.5z" stroke="#ffffff" stroke-width="2" fill="none"/></svg>
    </button>
    <span style="flex:1;text-align:center;" data-translate-key="main_title">ALMACEN</span>
    
    <!-- Widget de usuario -->
    <div id="userWidgetContainer" style="margin-right: 10px;"></div>
    
    <!-- Selector de idioma -->
    <select id="language-selector" onchange="changeLanguage(this.value)" style="margin-right: 20px; padding: 5px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; align-self: center;">
      <option value="es">ES</option>
      <option value="en">EN</option>
      <option value="cz">CZ</option>
    </select>
    
    <img class="EMESA-logo" src="/IMAGENES/Logo_EMESA.png" alt="Logo EMESA">
  </div>
  <div class="main-grid">
    <div class="card" onclick="window.location.href='Summary.html'" style="display: flex; align-items: center; justify-content: center; cursor:pointer;">
      <div class="card-title" style="text-align: center; width: 100%;" data-translate-key="card_summary_orders">Resumen Pedidos</div>
    </div>
  </div>

  <!-- SCRIPT ORIGINAL (con modificaciones para traducción) -->
  <script>
  
    // Código a agregar en cada pantalla HTML
    async function verificarPermisos() {
        try {
            const usuarioActual = JSON.parse(localStorage.getItem('usuarioSGA'));
            
            if (!usuarioActual) {
                window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_login.html';
                return;
            }
            
            const nivelUsuario = usuarioActual.nivel;
            const nivelRequerido = 5; // Nivel requerido para pantallas de reportes
            
            if (nivelUsuario < nivelRequerido) {
                alert('No tienes permisos para acceder a esta pantalla');
                window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
                return;
            }
            
        } catch (error) {
            console.error('Error verificando permisos:', error);
            window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_login.html';
        }
    }

    // Ejecutar al cargar la página
    document.addEventListener('DOMContentLoaded', verificarPermisos);
    
    // Esta función revisa si el usuario tiene permisos para ver la configuración
    function checkConfigPermission() {
      // Simulación: en un caso real, obtendrías esto del login
      const user = { role: 'admin' }; // Cambia a 'user' para probar el caso sin permisos
      if (user && user.role === 'admin') {
        window.location.href = '/Pantallas/Pantallas_Configuración/Configurar_Estanterias.html';
      } else {
        // MODIFICADO: Usa la clave de traducción
        alert(getTranslation('permission_denied'));
      }
    }
  </script>

  <!-- ======================= INICIO DEL SCRIPT DE TRADUCCIÓN ======================= -->
  <script>
    let currentTranslations = {};

    function getTranslation(key) {
      return currentTranslations[key] || key;
    }

    function applyTranslations(translations) {
      currentTranslations = translations;
      document.querySelectorAll('[data-translate-key]').forEach(element => {
        const key = element.getAttribute('data-translate-key');
        if (translations[key]) element.innerHTML = translations[key];
      });
      document.querySelectorAll('[data-translate-key-title]').forEach(element => {
        const key = element.getAttribute('data-translate-key-title');
        if (translations[key]) element.setAttribute('title', translations[key]);
      });
      document.querySelectorAll('[data-translate-key-placeholder]').forEach(element => {
        const key = element.getAttribute('data-translate-key-placeholder');
        if (translations[key]) element.setAttribute('placeholder', translations[key]);
      });
    }

    async function loadTranslations(lang) {
      try {
        const fileName = `translation_${lang}.json`;
        const response = await fetch(`/translations/${fileName}`);
        
        if (!response.ok) {
          console.warn(`Traducción para '${lang}' no encontrada. Cargando 'es' como alternativa.`);
          if (lang !== 'es') await loadTranslations('es');
          return;
        }
        const translations = await response.json();
        applyTranslations(translations);
        document.documentElement.lang = lang;
        localStorage.setItem('language', lang);

        const selector = document.getElementById('language-selector');
        if (selector) selector.value = lang;

      } catch (error) {
        console.error("Error al cargar o aplicar las traducciones:", error);
      }
    }

    function changeLanguage(lang) {
      loadTranslations(lang);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const preferredLanguage = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
      loadTranslations(preferredLanguage);
      
      // Crear widget de usuario
      if (typeof LoginModal !== 'undefined') {
          LoginModal.createUserWidget('userWidgetContainer');
      }
    });
  </script>
  <script src="/assets/loginModal.js"></script>
  <!-- ======================= FIN DEL SCRIPT DE TRADUCCIÓN ======================= -->
</body>
</html>
