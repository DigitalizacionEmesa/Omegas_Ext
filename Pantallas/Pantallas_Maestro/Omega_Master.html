<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/IMAGENES/favicon_omega.svg" type="image/svg+xml">
    <title data-translate-key="page_title_ob_cwt">OB y CWT</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <link rel="stylesheet" href="/assets/loginModal.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        /* Tus estilos originales se mantienen intactos */
        .omegas-table-container{background:#fff;border-radius:10px;box-shadow:0 2px 8px #0001;padding:2rem;margin-top:2rem}
        .omegas-table{width:100%;border-collapse:collapse}
        .omegas-table th,
        .omegas-table td{padding:.7rem 1rem;border-bottom:1px solid #e0e0e0;text-align:left}
        .omegas-table th{
            background:#1976d2;
            color:#fff;
            position:sticky;
            top:0;
            z-index:2;
        }
        .omegas-table td {
            background-clip: padding-box;
        }
        .omegas-table tr:last-child td{border-bottom:none}
        .search-box{margin-bottom:1.5rem}
        .header{background:#3880c7;color:#fff;display:flex;align-items:center;padding:0 0 0 12px;font-size:2rem;font-weight:700;letter-spacing:1px;border-radius:8px 8px 0 0;gap:18px;position:relative;height:80px}
        .header .home-icon{width:44px;height:44px;margin-right:10px;cursor:pointer;fill:#fff;background:0 0;border:none}
        .header .logo{height:38px;margin-left:18px}
        .header-title{flex:1;text-align:center;font-size:2rem;font-weight:700;margin-left:90px}
        .modal-bg{display:none;position:fixed;z-index:1000;left:0;top:0;width:100vw;height:100vh;background:rgba(0,0,0,.35);align-items:center;justify-content:center}
        .modal-bg.active{display:flex}
        .modal{background:#fff;border-radius:10px;padding:2rem 2.5rem;min-width:340px;max-width:95vw;box-shadow:0 4px 24px #0002;position:relative}
        .modal h2{margin-top:0;color:#1976d2}
        .modal .close-btn{position:absolute;right:18px;top:18px;background:0 0;border:none;font-size:1.7rem;color:#1976d2;cursor:pointer}
        .modal .import-btn{background:#1976d2;color:#fff;border:none;border-radius:5px;padding:.7em 1.5em;font-size:1.1em;cursor:pointer;margin-top:1.2em; display: inline-flex; align-items: center; justify-content: center;}
        .modal .import-btn[disabled]{background:#b0b0b0;cursor:not-allowed}
        .modal .drop-area{border:2px dashed #1976d2;border-radius:8px;padding:1.2em;text-align:center;color:#1976d2;background:#f7faff}
        .modal .drop-area.dragover{background:#e3f0ff}
        .modal .preview-table{width:100%;border-collapse:collapse;margin-top:1em;margin-bottom:1em}
        .modal .preview-table th,
        .modal .preview-table td{border:1px solid #e0e0e0;padding:.4em .7em;font-size:.98em}
        .modal .preview-table th{
            background:#1976d2;
            color:#fff;
            position:sticky;
            top:0;
            z-index:2;
        }
        .modal .preview-table td {
            background-clip: padding-box;
        }
        .modal .preview-table tr:last-child td{border-bottom:1px solid #e0e0e0}
        .modal .preview-message{margin-top:.7em;color:#1976d2;font-weight:500}
        .modal .spinner{display:inline-block;width:22px;height:22px;border:3px solid #1976d2;border-top:3px solid #fff;border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}
        @keyframes spin{100%{transform:rotate(360deg)}}
        @media (max-width:700px){
            .omegas-table-container{padding:.5rem}
            .omegas-table th,.omegas-table td{padding:.4rem .5rem;font-size:.95em}
        }
        .input-error {
            border: 2px solid #c00 !important;
            background: #ffeaea !important;
        }
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translateX(-2px); }
            20%, 80% { transform: translateX(4px); }
            30%, 50%, 70% { transform: translateX(-8px); }
            40%, 60% { transform: translateX(8px); }
            100% { transform: none; }
        }
    </style>
</head>
<body>
    <!-- Header generado por globalHeader.js -->
    <main>
        <div class="omegas-table-container">
            <div id="quick-add-error" style="display:none;color:#c00;font-weight:700;text-align:center;margin-bottom:8px;font-size:1.08em;"></div>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:1em;">
                <div class="search-box">
                    <label for="search-assy" data-translate-key="label_search_by_omega">Buscar por Omega:</label>
                    <input type="text" id="search-assy" placeholder="Escribe el Nombre de la Omega..." style="width:320px;" data-translate-key-placeholder="placeholder_search_omega">
                </div>
                <button id="openImportModalBtn" class="import-btn" style="margin:0;"><span data-translate-key="button_import_csv">Importar CSV</span></button>
            </div>
            <table class="omegas-table">
                <thead>
                    <tr>
                        <th data-translate-key="table_header_assy">Assy</th>
                        <th data-translate-key="table_header_beam">Beam</th>
                        <th data-translate-key="table_header_if1">IF1</th>
                        <th data-translate-key="table_header_if2">IF2</th>
                        <th data-translate-key="table_header_wc">W/C</th>
                        <th>Extender</th>
                        <th>GRP_OMEGA_BRACKET_TYPE</th>
                        <th data-translate-key="table_header_delete">Eliminar</th>
                    </tr>
                    <tr id="quick-add-row">
                        <td><input type="text" id="quick-assy" placeholder="Assy" style="width:100px;"></td>
                        <td><input type="text" id="quick-beam" placeholder="Beam" style="width:100px;"></td>
                        <td><input type="text" id="quick-if1" placeholder="IF1" style="width:80px;"></td>
                        <td><input type="text" id="quick-if2" placeholder="IF2" style="width:80px;"></td>
                        <td>
                            <select id="quick-wc" style="width:70px;">
                                <option value="C">C</option>
                                <option value="W">W</option>
                                <option value="CWT">CWT</option>
                                <option value="DS">DS</option>
                                <option value="EX">EX</option>
                                <option value="TB">TB</option>
                            </select>
                        </td>
                        <td><input type="text" id="quick-extender" placeholder="Extender" style="width:100px;"></td>
                        <td><input type="text" id="quick-bracket-type" placeholder="Bracket Type" style="width:120px;"></td>
                        <td style="text-align:center;">
                            <button id="quick-add-btn" style="background:#28a745;color:#fff;border:none;border-radius:4px;padding:0.3em 1em;cursor:pointer;font-weight:600;">+</button>
                        </td>
                    </tr>
                </thead>
                <tbody id="omegas-tbody"></tbody>
            </table>
        </div>
    </main>

    <div class="modal-bg" id="importModalBg">
        <div class="modal">
            <button class="close-btn" id="closeImportModalBtn" title="Cerrar" data-translate-key-title="modal_close_tooltip">×</button>
            <div style="display:flex;align-items:center;gap:2em;">
                <h2 style="margin:0;display:flex;align-items:center;" data-translate-key="modal_title_import_omegas">Importar Omegas desde CSV</h2>
                <a href="/assets/Plantilla_Omegas.xlsx" download style="margin:0;display:flex;align-items:center;">
                    <button class="import-btn" type="button" style="margin-top: 4px !important; background:#3880c7; color:#fff; padding:0.5em 0.5em; font-size:1em; text-decoration:none;">
                        <span data-translate-key="button_download_template">Descargar plantilla</span>
                    </button>
                </a>
            </div>
            <div style="height: 25px;"></div>
            <div class="drop-area" id="dropArea">
                <span data-translate-key="text_drop_area_1">Arrastra y suelta tu archivo CSV aquí o </span><label style="color:#1976d2;cursor:pointer;"><span data-translate-key="text_drop_area_2">haz clic para seleccionarlo</span><input type="file" id="csvFileInput" accept=".csv" style="display:none;"></label>
            </div>
            <div id="previewArea"></div>
            <div style="display: flex; justify-content: flex-end;">
                <button class="import-btn" id="confirmImportBtn" disabled><span data-translate-key="button_import_data">Importar Datos</span></button>
            </div>
        </div>
    </div>

    <!-- ========= SCRIPT DE LÓGICA DE LA PÁGINA (Unificado) ========= -->
    <script>
        // ===== CÓDIGO DE VALIDACIÓN DE PERMISOS =====
        async function verificarPermisos() {
            try {
                // Obtener datos del usuario desde localStorage
                const usuarioSGA = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
                
                if (!usuarioSGA.id || !usuarioSGA.nivel) {
                    console.log('No hay sesión activa, esperando login...');
                    return;
                }
                
                const nivelUsuario = usuarioSGA.nivel;
                
                console.log(`🔍 Verificando permisos - Usuario: ${usuarioSGA.nombre}, Nivel: ${nivelUsuario}`);
                
                // Esta pantalla requiere nivel 10 (Maestro)
                if (nivelUsuario < 10) {
                    alert(`❌ Acceso denegado.\n\nNecesitas nivel 10 (Administrador) para acceder a esta sección.\nTu nivel actual: ${nivelUsuario}`);
                    window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
                    return;
                }
                
                console.log(`✅ Acceso permitido - Omega Master`);
                
                // Una vez verificados los permisos, inicializar la página
                setupPageLogic();
                
            } catch (error) {
                console.error('Error verificando permisos:', error);
                alert('Error al verificar permisos. Redirigiendo al inicio...');
                window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
            }
        }

        // Ejecutar verificación al cargar la página
        document.addEventListener('DOMContentLoaded', verificarPermisos);
        
        // Escuchar evento de login exitoso
        window.addEventListener('userLoggedIn', verificarPermisos);
        // ===== FIN CÓDIGO DE VALIDACIÓN =====

        let omegasData = [];
        let parsedImportData = [];

        function renderTable(data) {
            const tbody = document.getElementById('omegas-tbody');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;color:#888;">${getTranslation('text_no_data')}</td></tr>`;
                return;
            }
            // Orden personalizado: C primero, luego W, luego CWT, luego DS, luego EX, luego TB
            const wcOrder = { 'C': 0, 'W': 1, 'CWT': 2, 'DS': 3, 'EX': 4, 'TB': 5 };
            data.sort((a, b) => {
                const aVal = (a['W/C'] || '').toUpperCase();
                const bVal = (b['W/C'] || '').toUpperCase();
                const aOrder = wcOrder.hasOwnProperty(aVal) ? wcOrder[aVal] : 99;
                const bOrder = wcOrder.hasOwnProperty(bVal) ? wcOrder[bVal] : 99;
                if (aOrder !== bOrder) return aOrder - bOrder;
                // Si son iguales, ordenar por Assy alfabéticamente
                return (a['Assy'] || '').localeCompare(b['Assy'] || '');
            });
            data.forEach((row, rowIdx) => {
                const tr = document.createElement('tr');
                const columns = ['Assy', 'Beam', 'IF1', 'IF2', 'W/C', 'ExtenderVariable', 'OmegaType'];
                columns.forEach(col => {
                    const td = document.createElement('td');
                    // Mostrar '-' si el valor es null, undefined, string vacío o 'NULL' (insensible a mayúsculas)
                    let value = row[col];
                    if (value === null || value === undefined || value === '' || (typeof value === 'string' && value.trim().toUpperCase() === 'NULL')) {
                        td.innerText = '-';
                    } else {
                        td.innerText = value;
                    }
                    if (col !== 'W/C') {
                        td.contentEditable = true;
                        td.style.background = '#fff';
                        td.style.outline = 'none';
                        td.addEventListener('blur', function() {
                            const newValue = td.innerText.trim();
                            if (row[col] !== newValue && newValue !== '-') {
                                row[col] = newValue;
                                const payload = row.OmegaID != null ? { OmegaID: row.OmegaID } : { Assy: row.Assy };
                                if (col === 'Assy') {
                                    payload['newAssy'] = newValue;
                                } else if (col === 'OmegaType') {
                                    payload['OmegaType'] = newValue;
                                } else {
                                    payload[col] = newValue;
                                }
                                fetch('/api/omegas/update', {
                                    method: 'PATCH',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(payload)
                                })
                                .then(res => res.json())
                                .then(resp => {
                                    if (!resp.success) {
                                        alert((getTranslation('alert_error_updating')||'Error actualizando') + (resp.error ? (': ' + resp.error) : ''));
                                    }
                                })
                                .catch(() => alert(getTranslation('alert_network_error_updating')||'Error de red al actualizar'));
                            }
                        });
                    } else {
                        td.contentEditable = false;
                        td.style.background = '#f5f5f5';
                    }
                    tr.appendChild(td);
                });
                // Delete button column (not editable)
                const tdDelete = document.createElement('td');
                tdDelete.style.textAlign = 'center';
                tdDelete.innerHTML = `<button class="delete-row-btn" title="${getTranslation('table_header_delete')}" style="background:none;border:none;cursor:pointer;padding:0;"><svg width="22" height="22" viewBox="0 0 24 24" fill="#c00"><path d="M3 6h18m-4-2V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M5 6h14v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" stroke="#c00" stroke-width="2" fill="none"/><line x1="10" y1="11" x2="10" y2="17" stroke="#c00"/><line x1="14" y1="11" x2="14" y2="17" stroke="#c00"/></svg></button>`;
                tdDelete.querySelector('.delete-row-btn').onclick = function(e) {
                    e.preventDefault();
                    if (!confirm(getTranslation('confirm_delete_omega'))) return;
                    const payload = row.OmegaID != null ? { OmegaID: row.OmegaID } : { Assy: row.Assy };
                    fetch('/api/omegas/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
                    .then(res => res.json().catch(() => ({error:'Respuesta no es JSON'})))
                    .then(resp => {
                        if (resp.success) window.location.reload(true);
                        else alert(`${getTranslation('alert_error_deleting')} ${resp.error||'Error desconocido'}`);
                    })
                    .catch(() => alert(getTranslation('alert_network_error_deleting')));
                };
                tr.appendChild(tdDelete);
                tbody.appendChild(tr);
            });
        }

        function filterTable() {
            const value = document.getElementById('search-assy').value.trim().toLowerCase();
            const filtered = value ? omegasData.filter(row => (row.Assy || '').toLowerCase().includes(value)) : omegasData;
            renderTable(filtered);
        }

        function loadStockData() {
            fetch('/api/omegas/all')
                .then(res => res.json())
                .then(data => {
                    omegasData = data;
                    renderTable(omegasData);
                })
                .catch(() => {
                    document.getElementById('omegas-tbody').innerHTML = `<tr><td colspan="6" style="text-align:center;color:#c00;">${getTranslation('text_error_loading_data')}</td></tr>`;
                });
        }

        function setupPageLogic() {
            loadStockData();
            document.getElementById('search-assy').addEventListener('input', filterTable);
            // Quick add logic
            document.getElementById('quick-add-btn').onclick = function() {
                console.log('🔵 Botón + clickeado');
                const assyInput = document.getElementById('quick-assy');
                const wcInput = document.getElementById('quick-wc');
                const beamRaw = document.getElementById('quick-beam').value.trim();
                const if1Raw = document.getElementById('quick-if1').value.trim();
                const if2Raw = document.getElementById('quick-if2').value.trim();
                const extenderRaw = document.getElementById('quick-extender').value.trim();
                const bracketTypeRaw = document.getElementById('quick-bracket-type').value.trim();
                const assy = assyInput.value.trim();
                const wc = wcInput.value;
                const errorDiv = document.getElementById('quick-add-error');
                // Clear error and remove highlight
                errorDiv.style.display = 'none';
                errorDiv.textContent = '';
                assyInput.classList.remove('input-error','shake');
                wcInput.classList.remove('input-error','shake');
                void errorDiv.offsetHeight;
                let hasError = false;
                if (!assy) {
                    assyInput.classList.add('input-error','shake');
                    hasError = true;
                }
                if (!wc) {
                    wcInput.classList.add('input-error','shake');
                    hasError = true;
                }
                if (hasError) {
                    errorDiv.textContent = getTranslation('error_required_fields');
                    errorDiv.style.display = 'block';
                    setTimeout(() => {
                        assyInput.classList.remove('shake');
                        wcInput.classList.remove('shake');
                    }, 500);
                    return;
                }
                // Optional fields as null if blank (except ExtenderVariable and OmegaType which get empty string for NOT NULL)
                const beam = beamRaw === '' ? null : beamRaw;
                const if1 = if1Raw === '' ? null : if1Raw;
                const if2 = if2Raw === '' ? null : if2Raw;
                const extender = extenderRaw === '' ? '' : extenderRaw;
                const bracketType = bracketTypeRaw === '' ? '' : bracketTypeRaw;
                const payload = { Assy: assy, Beam: beam, IF1: if1, IF2: if2, 'W/C': wc, ExtenderVariable: extender, OmegaType: bracketType };
                console.log('📤 Payload enviado:', payload);
                fetch('/api/omegas/bulk-insert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([payload])
                })
                .then(res => {
                    console.log('📥 Status:', res.status);
                    return res.json();
                })
                .then(resp => {
                    console.log('✅ Respuesta:', resp);
                    if (resp.success) {
                        // Limpiar inputs
                        document.getElementById('quick-assy').value = '';
                        document.getElementById('quick-beam').value = '';
                        document.getElementById('quick-if1').value = '';
                        document.getElementById('quick-if2').value = '';
                        document.getElementById('quick-wc').value = 'C';
                        document.getElementById('quick-extender').value = '';
                        document.getElementById('quick-bracket-type').value = '';
                        errorDiv.textContent = '';
                        errorDiv.style.display = 'none';
                        assyInput.classList.remove('input-error','shake');
                        wcInput.classList.remove('input-error','shake');
                        loadStockData();
                    } else {
                        errorDiv.textContent = (resp.error || 'Error añadiendo Omega');
                        errorDiv.style.display = 'block';
                    }
                })
                .catch(err => { 
                    console.error('❌ Error de red:', err);
                    errorDiv.textContent = 'Error de red añadiendo Omega'; 
                    errorDiv.style.display = 'block'; 
                });
            };

            // Limpiar error al escribir en cualquier input del quick-add
            ['quick-assy','quick-beam','quick-if1','quick-if2','quick-wc'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', function() {
                        const errorDiv = document.getElementById('quick-add-error');
                        errorDiv.textContent = '';
                        errorDiv.style.display = 'none';
                        document.getElementById('quick-assy').classList.remove('input-error','shake');
                        document.getElementById('quick-wc').classList.remove('input-error','shake');
                    });
                }
            });

            // ...existing code for import modal and CSV...
            const importModalBg = document.getElementById('importModalBg');
            const openImportModalBtn = document.getElementById('openImportModalBtn');
            const closeImportModalBtn = document.getElementById('closeImportModalBtn');
            const csvFileInput = document.getElementById('csvFileInput');
            const dropArea = document.getElementById('dropArea');
            const previewArea = document.getElementById('previewArea');
            const confirmImportBtn = document.getElementById('confirmImportBtn');

            openImportModalBtn.onclick = () => { importModalBg.classList.add('active'); resetImportModal(); };
            closeImportModalBtn.onclick = () => { importModalBg.classList.remove('active'); resetImportModal(); };
            importModalBg.onclick = e => { if (e.target === importModalBg) { importModalBg.classList.remove('active'); resetImportModal(); } };

            function resetImportModal() {
                previewArea.innerHTML = '';
                confirmImportBtn.disabled = true;
                confirmImportBtn.innerHTML = `<span data-translate-key="button_import_data">${getTranslation('button_import_data')}</span>`;
                parsedImportData = [];
                csvFileInput.value = '';
            }

            dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('dragover'); });
            dropArea.addEventListener('dragleave', e => { e.preventDefault(); dropArea.classList.remove('dragover'); });
            dropArea.addEventListener('drop', e => {
                e.preventDefault(); dropArea.classList.remove('dragover');
                if (e.dataTransfer.files.length) { csvFileInput.files = e.dataTransfer.files; handleFile(csvFileInput.files[0]); }
            });
            csvFileInput.addEventListener('change', function() { if (this.files && this.files[0]) handleFile(this.files[0]); });

            function handleFile(file) {
                if (!file.name.endsWith('.csv')) {
                    previewArea.innerHTML = `<div style="color:#c00;">${getTranslation('alert_file_must_be_csv')}</div>`;
                    confirmImportBtn.disabled = true;
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const text = e.target.result;
                    const delimiter = (text.match(/;/g) || []).length > (text.match(/,/g) || []).length ? ';' : ',';
                    Papa.parse(text, {
                        header: true, skipEmptyLines: true, delimiter: delimiter,
                        complete: function(results) {
                            let data = results.data.map(row => { let c = {}; for (let k in row) { c[k.trim()] = row[k] != null && typeof row[k] === 'string' ? (row[k].trim() === '' ? null : row[k].trim()) : row[k]; } return c; });
                            data = data.filter(row => Object.values(row).some(val => val != null && val !== ''));
                            parsedImportData = data;
                            showPreview(data);
                        },
                        error: function() { previewArea.innerHTML = `<div style="color:#c00;">${getTranslation('alert_error_reading_csv')}</div>`; confirmImportBtn.disabled = true; }
                    });
                };
                reader.readAsText(file);
            }

            function showPreview(data) {
                if (!data.length) { previewArea.innerHTML = `<div style="color:#c00;">${getTranslation('alert_no_valid_data')}</div>`; confirmImportBtn.disabled = true; return; }
                const columns = ['Assy', 'Beam', 'IF1', 'IF2', 'W/C', 'ExtenderVariable', 'OmegaType'];
                let html = `<div class="preview-message">${getTranslation('text_preview_message').replace('{count}', data.length)}</div>`;
                html += '<table class="preview-table"><thead><tr>';
                columns.forEach(col => html += `<th>${col}</th>`);
                html += '</tr></thead><tbody>';
                data.slice(0, 10).forEach(row => { html += '<tr>'; columns.forEach(col => html += `<td>${row[col] ?? ''}</td>`); html += '</tr>'; });
                html += '</tbody></table>';
                if (data.length > 10) html += `<div style="color:#888;font-size:0.95em;">${getTranslation('text_preview_show_first_10')}</div>`;
                previewArea.innerHTML = html;
                confirmImportBtn.disabled = false;
            }

            confirmImportBtn.onclick = function() {
                if (!parsedImportData.length) return;
                confirmImportBtn.disabled = true;
                confirmImportBtn.innerHTML = `<span class="spinner"></span> <span>${getTranslation('button_importing')}</span>`;
                fetch('/api/omegas/bulk-insert', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(parsedImportData) })
                .then(res => res.json())
                .then(resp => {
                    if (resp.success) {
                        alert(getTranslation('alert_import_success'));
                        importModalBg.classList.remove('active');
                        resetImportModal();
                        loadStockData();
                    } else {
                        alert(`${getTranslation('alert_import_error')} ${resp.error || 'Error desconocido'}`);
                        confirmImportBtn.disabled = false;
                        confirmImportBtn.innerHTML = `<span data-translate-key="button_import_data">${getTranslation('button_import_data')}</span>`;
                    }
                })
                .catch(() => {
                    alert(getTranslation('alert_network_error_importing'));
                    confirmImportBtn.disabled = false;
                    confirmImportBtn.innerHTML = `<span data-translate-key="button_import_data">${getTranslation('button_import_data')}</span>`;
                });
            };
        }
    </script>

    <!-- ======================= INICIO DEL SCRIPT DE TRADUCCIÓN (CORREGIDO) ======================= -->
    <script>
        let currentTranslations = {};
        function getTranslation(key) { return currentTranslations[key] || key; }
        function applyTranslations(translations) {
            currentTranslations = translations;
            document.querySelectorAll('[data-translate-key]').forEach(el => { if (translations[el.getAttribute('data-translate-key')]) el.innerHTML = translations[el.getAttribute('data-translate-key')]; });
            document.querySelectorAll('[data-translate-key-title]').forEach(el => { if (translations[el.getAttribute('data-translate-key-title')]) el.setAttribute('title', translations[el.getAttribute('data-translate-key-title')]); });
            document.querySelectorAll('[data-translate-key-placeholder]').forEach(el => { if (translations[el.getAttribute('data-translate-key-placeholder')]) el.setAttribute('placeholder', translations[el.getAttribute('data-translate-key-placeholder')]); });
        }
        async function loadTranslations(lang) {
            try {
                const response = await fetch(`/translations/translation_${lang}.json`);
                if (!response.ok) { if (lang !== 'es') await loadTranslations('es'); return; }
                const translations = await response.json();
                applyTranslations(translations);
                document.documentElement.lang = lang;
                localStorage.setItem('language', lang);
                // Sincronizar ambos selectores
                const selector = document.getElementById('language-selector');
                const headerSelector = document.getElementById('header-language-selector');
                if (selector) selector.value = lang;
                if (headerSelector) headerSelector.value = lang;
            } catch (error) { console.error("Error al cargar traducciones:", error); }
        }
        function changeLanguage(lang) {
            loadTranslations(lang).then(() => {
                if (typeof renderTable === 'function' && typeof omegasData !== 'undefined') {
                    renderTable(omegasData);
                }
            });
        }
        document.addEventListener('DOMContentLoaded', () => {
            const lang = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
            loadTranslations(lang);
        });
    </script>
    <script src="/assets/globalHeader.js" data-title="OB y CWT" data-title-key="header_ob_cwt"></script>
    <!-- ======================= FIN DEL SCRIPT DE TRADUCCIÓN ======================= -->
</body>
</html>
