<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/IMAGENES/favicon_omega.svg" type="image/svg+xml">
  <title data-translate-key="page_title_master">Maestro de Materiales - Almacén</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/loginModal.css">
</head>
<body>
  <!-- El header global se insertará automáticamente -->

  <style>
    .main-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 32px;
      max-width: 900px;
      margin: 38px auto 0 auto;
      width: 96%;
    }
    @media (max-width: 700px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
    .card.full-width {
      grid-column: 1 / -1;
      min-height: 110px;
      font-size: 2rem;
    }
  </style>
  <div class="main-grid">
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Maestro/Omega_Master.html'" style="display: flex; align-items: center; justify-content: center;">
      <div class="card-title" style="text-align: center; width: 100%;" data-translate-key="omega_master_card">OMEGA MASTER</div>
    </div>
    <div class="card" onclick="window.location.href='/Pantallas/Pantallas_Maestro/ProductosFaltantes_Master.html'" style="display: flex; align-items: center; justify-content: center;">
      <div class="card-title" style="text-align: center; width: 100%;" data-translate-key="missing_products_card">PRODUCTOS FALTANTES</div>
    </div>
  </div>

  <!-- ======================= INICIO DEL SCRIPT ======================= -->
  <script>
    // ===== CÓDIGO DE VALIDACIÓN DE PERMISOS (NUEVO SISTEMA) =====
    async function verificarPermisos() {
        try {
            // NUEVO SISTEMA: usar usuarioSGA (login modal)
            const usuarioActual = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
            
            if (!usuarioActual.id || !usuarioActual.nivel) {
                // El loginModal.js se encargará de mostrar el modal de login
                console.log('No hay sesión activa, esperando login...');
                return false;
            }
            
            const nivelUsuario = usuarioActual.nivel;
            
            console.log(`🔍 Verificando permisos - Usuario: ${usuarioActual.nombre}, Nivel: ${nivelUsuario}`);
            
            // Esta pantalla requiere nivel 10 (Maestro)
            if (nivelUsuario < 10) {
                alert(`❌ Acceso denegado.\n\nNecesitas nivel 10 (Administrador) para acceder a esta sección.\nTu nivel actual: ${nivelUsuario}`);
                window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
                return false;
            }
            
            console.log(`✅ Acceso permitido - Pantalla General Maestro`);
            return true;
            
        } catch (error) {
            console.error('Error verificando permisos:', error);
            alert('Error al verificar permisos. Redirigiendo al inicio...');
            window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
            return false;
        }
    }

    // Ejecutar verificación cuando el usuario se loguee
    document.addEventListener('DOMContentLoaded', () => {
      // Esperar a que el usuario esté logueado para verificar permisos
      window.addEventListener('userLoggedIn', verificarPermisos);
      // Si ya hay usuario, ejecutar directamente
      const usuario = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
      if (usuario.id) {
        verificarPermisos();
      }
    });
    // ===== FIN CÓDIGO DE VALIDACIÓN =====
    
    let currentTranslations = {};

    function applyTranslations(translations) {
      currentTranslations = translations;
      document.querySelectorAll('[data-translate-key]').forEach(element => {
        const key = element.getAttribute('data-translate-key');
        if (translations[key]) {
          element.innerHTML = translations[key];
        }
      });
      document.querySelectorAll('[data-translate-key-title]').forEach(element => {
        const key = element.getAttribute('data-translate-key-title');
        if (translations[key]) {
          element.setAttribute('title', translations[key]);
        }
      });
    }

    async function loadTranslations(lang) {
      try {
        const fileName = `translation_${lang}.json`;
        const response = await fetch(`/translations/${fileName}`);
        
        if (!response.ok) {
          console.warn(`Traducción para '${lang}' no encontrada. Cargando 'es' como alternativa.`);
          if (lang !== 'es') {
            await loadTranslations('es');
          }
          return;
        }
        const translations = await response.json();
        applyTranslations(translations);
        document.documentElement.lang = lang;
        localStorage.setItem('language', lang);

        // Sincroniza todos los selectores de idioma
        const selectors = ['language-selector', 'header-language-selector'];
        selectors.forEach(id => {
          const selector = document.getElementById(id);
          if (selector) selector.value = lang;
        });

      } catch (error) {
        console.error("Error al cargar o aplicar las traducciones:", error);
      }
    }

    function changeLanguage(lang) {
      loadTranslations(lang);
    }

    // Cargar idioma inicial
    const preferredLanguage = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
    loadTranslations(preferredLanguage);
  </script>
  <!-- Header global (incluye login widget y selector de idioma) -->
  <script src="/assets/globalHeader.js" data-title="MAESTRO MATERIALES" data-title-key="master_omegas"></script>
  <!-- ======================= FIN DEL SCRIPT ======================= -->
</body>
</html>
