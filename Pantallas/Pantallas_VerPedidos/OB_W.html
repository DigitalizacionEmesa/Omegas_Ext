<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/IMAGENES/favicon_omega.svg" type="image/svg+xml">
    <title data-translate-key="page_title_sequenced_w">Pedidos Secuenciados W</title>
    <link rel="stylesheet" href="../../assets/styles.css">
    <link rel="stylesheet" href="/assets/loginModal.css">
</head>
<body>
  <!-- Header generado por globalHeader.js -->
  <div class="main-grid" id="cardsGrid" style="display: flex; flex-direction: column; gap: 28px; padding: 40px 0; max-width: 1200px; margin: 0 auto;">
    <!-- Cards se insertan por JS -->
  </div>

  <!-- SCRIPT DE LÓGICA DE LA PÁGINA (MODIFICADO) -->
  <script>
    // ===== CÓDIGO DE VALIDACIÓN DE PERMISOS =====
    async function verificarPermisos() {
        try {
            // Obtener datos del usuario desde localStorage
            const usuarioSGA = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
            
            if (!usuarioSGA.id || !usuarioSGA.nivel) {
                console.log('No hay sesión activa, esperando login...');
                return;
            }
            
            const nivelUsuario = usuarioSGA.nivel;
            
            console.log(`🔍 Verificando permisos - Usuario: ${usuarioSGA.nombre}, Nivel: ${nivelUsuario}`);
            
            // Esta pantalla requiere nivel 1 (acceso básico)
            if (nivelUsuario < 1) {
                alert(`❌ Acceso denegado.\n\nNecesitas nivel 1 o superior para acceder a esta sección.\nTu nivel actual: ${nivelUsuario}`);
                window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
                return;
            }
            
            console.log(`✅ Acceso permitido - OB W`);
            
        } catch (error) {
            console.error('Error verificando permisos:', error);
            alert('Error al verificar permisos. Redirigiendo al inicio...');
            window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
        }
    }

    // Ejecutar al cargar la página
    document.addEventListener('DOMContentLoaded', verificarPermisos);
    
    // Escuchar evento de login exitoso
    window.addEventListener('userLoggedIn', verificarPermisos);
    
    let pedidosCache = [];
    let extendersCache = {};
    let descuentoCache = {};

    async function getPedidosSecuenciadosW() {
      const res = await fetch('/api/pedidos_secuenciados_w');
      if (!res.ok) return [];
      return await res.json();
    }

    async function obtenerExtendersDelPedido(numeroPedido) {
      if (extendersCache[numeroPedido]) {
        return extendersCache[numeroPedido];
      }

      try {
        const res = await fetch(`/api/obtener-extenders-pedido?numero_pedido=${encodeURIComponent(numeroPedido)}`);
        if (!res.ok) {
          return { assy_extensores: [] };
        }
        const data = await res.json();
        extendersCache[numeroPedido] = data;
        return data;
      } catch (error) {
        console.error(`Error obteniendo extensores: ${error}`);
        return { assy_extensores: [] };
      }
    }

    // Nueva función: obtener info del material de descuento para un pedido
    async function obtenerMaterialDescuentoPedido(numeroPedido) {
      // Si ya está en caché, devolver
      if (descuentoCache.hasOwnProperty(numeroPedido)) {
        return descuentoCache[numeroPedido];
      }
      
      try {
        const res = await fetch(`/api/obtener-material-descuento-pedido?numero_pedido=${encodeURIComponent(numeroPedido)}`);
        if (!res.ok) {
          console.warn(`No se pudo obtener material de descuento para pedido ${numeroPedido}`);
          return { assy_descuento: null };
        }
        const data = await res.json();
        descuentoCache[numeroPedido] = data;
        return data;
      } catch (error) {
        console.error(`Error obteniendo material de descuento: ${error}`);
        return { assy_descuento: null };
      }
    }

    function esAssynExtensor(assy, extendersData) {
      if (!extendersData || !extendersData.assy_extensores) return false;
      return extendersData.assy_extensores.some(ext => ext.toUpperCase() === (assy || '').toUpperCase());
    }

    // Nueva función: verificar si un Assy es el material de descuento
    function esAssynDescuento(assy, descuentoData) {
      if (!descuentoData) return false;
      const assyActual = (assy || '').toUpperCase();
      const assyDescuentoList = Array.isArray(descuentoData.assy_descuento_list)
        ? descuentoData.assy_descuento_list.map(item => String(item || '').toUpperCase())
        : [];

      if (assyDescuentoList.length > 0) {
        return assyDescuentoList.includes(assyActual);
      }

      if (!descuentoData.assy_descuento) return false;
      return assyActual === descuentoData.assy_descuento.toUpperCase();
    }

    async function actualizarCantidadesExtender() {
      const extenderQtyNodes = Array.from(document.querySelectorAll('.extender-qty-value'));
      const pedidos = [...new Set(extenderQtyNodes.map(node => node.dataset.salesOrder).filter(Boolean))];

      // Obtener datos del material de descuento (OmegaType) para cada pedido
      await Promise.all(pedidos.map(obtenerMaterialDescuentoPedido));

      extenderQtyNodes.forEach(node => {
        const salesOrder = node.dataset.salesOrder || '';
        const assy = (node.dataset.assy || '').toUpperCase();
        const qty = Number(node.dataset.qty || 0);
        const descuentoData = descuentoCache[salesOrder] || { assy_descuento: null, assy_descuento_list: [] };
        
        // Comparar el Assy de la tarjeta contra todos los Assy asociados al mismo OmegaType.
        const esOmegaType = esAssynDescuento(assy, descuentoData);
        node.textContent = esOmegaType ? Math.max(0, qty - 2) : '-';
      });
    }

    async function renderCards(pedidos) {
      // Orden estable: PriorityOrder asc si existe; si no, por parte numérica de Sequence asc
      function parseSeq(val) {
        if (val === null || val === undefined) return Number.POSITIVE_INFINITY;
        const m = String(val).match(/\d+/g);
        if (!m || m.length === 0) return Number.POSITIVE_INFINITY;
        return parseInt(m[m.length - 1], 10);
      }
      function compareOrders(a, b) {
        const pa = (typeof a.PriorityOrder === 'number') ? a.PriorityOrder : null;
        const pb = (typeof b.PriorityOrder === 'number') ? b.PriorityOrder : null;
        if (pa !== null && pb !== null) return pa - pb;
        const sa = parseSeq(a.Sequence || a.SequenceValue);
        const sb = parseSeq(b.Sequence || b.SequenceValue);
        if (sa !== sb) return sa - sb;
        return 0;
      }
      const sorted = Array.isArray(pedidos) ? [...pedidos].sort(compareOrders) : [];
      pedidosCache = sorted;
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      if (!sorted.length) {
        const vacio = document.createElement('div');
        vacio.textContent = getTranslation('text_no_w_orders');
        vacio.style.textAlign = 'center';
        vacio.style.color = '#3456a1';
        vacio.style.marginTop = '40px';
        grid.appendChild(vacio);
        return;
      }
      // Los pedidos ya vienen ordenados correctamente del backend con PriorityOrder
      // No necesitamos ordenarlos aquí
      sorted.forEach((pedido, idx) => {
        const card = document.createElement('div');
        card.className = 'secuenciacion-card';
        card.style = `background: #f4f8ff; border-radius: 22px; box-shadow: 0 8px 32px rgba(0,91,170,0.18); display: flex; flex-direction: column; gap: 0; padding: 0; min-height: 260px; font-size: 1.5rem; font-weight: 600; position:relative; border-left: 14px solid #1976d2; margin: 0; width: 100%; max-width: 1700px;`;

        // Nuevo: contenedor para el código de barras online usando bwip-js
        const barcodeImgId = `barcodeimg_${idx}_${pedido.SalesOrder}`;
        card.innerHTML = `
          <div style="background:#1976d2;color:white;padding:28px 48px 18px 48px;border-radius:10px 22px 0 0;display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:2.2rem;font-weight:700;letter-spacing:2px;">${getTranslation('card_label_sequence')} ${pedido.Sequence || ''}</span>
            <span style="font-size:2rem;font-weight:600;">${getTranslation('card_label_order')} ${pedido.SalesOrder || ''}</span>
          </div>
          <div style="display:flex;flex-wrap:nowrap;gap:38px;padding:28px 64px 0 64px;justify-content:center;">
            <div class="pedido-info-container pedido-info-top"><span>${getTranslation('table_header_assy')}</span><div>${pedido.Assy || ''}</div></div>
            <div class="pedido-info-container pedido-info-top"><span>${getTranslation('table_header_beam')}</span><div>${pedido.Beam || ''}</div></div>
            <div class="pedido-info-container pedido-info-top">
              <span style="${pedido.IF1 && pedido.IF2 && pedido.IF1 !== pedido.IF2 ? 'margin-bottom:0px !important;' : ''}">${getTranslation('card_label_if')}</span>
              <div style="font-size: 1.35rem;">${pedido.IF1 && pedido.IF2 && pedido.IF1 !== pedido.IF2 ? `${pedido.IF1} ${pedido.IF2}` : (pedido.IF1 || pedido.IF2 || '')}</div>
            </div>
            <div class="pedido-info-container pedido-info-top"><span>${getTranslation('card_label_extender')}</span><div>${pedido.Extender || '-'}</div></div>
            <div class="pedido-info-container pedido-info-top" style="${pedido.WO && String(pedido.WO).split(',').length === 3 ? 'height:135px;' : ''}">
              <span style="${pedido.WO && String(pedido.WO).includes(',') ? 'margin-bottom:0px !important;' : ''}">${getTranslation('card_label_wo')}</span>
              <div style="font-size: 1.4rem !important;">${(pedido.WO || '').replace(/,/g, ', ')}</div>
            </div>
          </div>
          <div style="display:flex;flex-wrap:nowrap;gap:38px;padding:18px 64px 38px 64px;justify-content:center;align-items:center;">
            <div class="pedido-info-container pedido-info-bottom"><span>${getTranslation('card_label_qty')}</span><div>${pedido.Qty || ''}</div></div>
            <div class="pedido-info-container pedido-info-bottom"><span>${getTranslation('card_label_done_qty')}</span><div>${(pedido.DoneQty === 0 || pedido.DoneQty === '0' || pedido.DoneQty === null || pedido.DoneQty === undefined || pedido.DoneQty === '') ? 0 : pedido.DoneQty}</div></div>
            <div class="pedido-info-container pedido-info-bottom"><span>${getTranslation('card_label_extender_qty')}</span><div class="extender-qty-value" data-assy="${pedido.Assy}" data-sales-order="${pedido.SalesOrder}" data-qty="${pedido.Qty}">-</div></div>
            <!-- Nuevo contenedor para el código de barras online usando bwip-js -->
            <div class="pedido-info-container pedido-info-bottom" style="background:#f9f9f9;min-width:240px;max-width:360px;width:100%;height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:auto;">
              <span style="font-size:1.3rem;color:#1976d2;font-weight:700;margin-bottom:6px;">${getTranslation('barcode_label')}</span>
              <div style="width:320px;height:100px;overflow:hidden;display:flex;align-items:center;justify-content:center;">
                <img id="${barcodeImgId}" style="height:90px;width:420px;object-position:center;display:block;padding: 0 8px;" alt="barcode" src="" />
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
        // Generar el código de barras online usando la API de bwip-js con la primera WO
        let firstWO = '';
        if (pedido.WO) {
          const woArr = String(pedido.WO).split(',').map(w => w.trim()).filter(w => w);
          if (woArr.length > 0) firstWO = woArr[0];
        }
        if (firstWO) {
          const barcodeUrl = `https://bwipjs-api.metafloor.com/?bcid=code39&text=${encodeURIComponent(firstWO)}&scale=4&height=18`;
          const img = card.querySelector(`#${barcodeImgId}`);
          if (img) img.src = barcodeUrl;
        } else {
          const img = card.querySelector(`#${barcodeImgId}`);
          if (img) img.src = '';
        }
      });

      await actualizarCantidadesExtender();
    }

    function setupPageLogic() {
        async function autoUpdate() {
            const pedidos = await getPedidosSecuenciadosW();
            await renderCards(pedidos);
        }
        autoUpdate();
        setInterval(autoUpdate, 5000);
    }
  </script>

  <!-- ESTILOS ADICIONALES -->
  <style>

    @media (max-width:480px){.main-grid{gap:12px;padding:10px 8px}.pedido-info-container{min-width:90px;max-width:110px;height:75px;font-size:0.8rem;padding:3px}.pedido-info-container span{font-size:0.9rem;margin-bottom:3px}.pedido-info-container div{font-size:0.85rem}}
    @media (max-width:360px){.pedido-info-top{font-size:0.8rem}.pedido-info-bottom{font-size:1rem}.pedido-info-container{min-width:80px;max-width:100px;height:70px;font-size:0.75rem;padding:2px}.pedido-info-container span{font-size:0.75rem;margin-bottom:2px}.pedido-info-container div{font-size:0.7rem}}
  </style>

  <!-- ======================= INICIO DEL SCRIPT DE TRADUCCIÓN ======================= -->
  <script>
      
      let currentTranslations = {};
      function getTranslation(key) { return currentTranslations[key] || key; }
      function applyTranslations(translations) {
          currentTranslations = translations;
          document.querySelectorAll('[data-translate-key]').forEach(el => { if (translations[el.getAttribute('data-translate-key')]) el.innerHTML = translations[el.getAttribute('data-translate-key')]; });
          document.querySelectorAll('[data-translate-key-title]').forEach(el => { if (translations[el.getAttribute('data-translate-key-title')]) el.setAttribute('title', translations[el.getAttribute('data-translate-key-title')]); });
      }
      async function loadTranslations(lang) {
          try {
              const response = await fetch(`/translations/translation_${lang}.json`);
              if (!response.ok) { if (lang !== 'es') await loadTranslations('es'); return; }
              const translations = await response.json();
              applyTranslations(translations);
              document.documentElement.lang = lang;
              localStorage.setItem('language', lang);
              // Sincronizar ambos selectores
              const selector = document.getElementById('language-selector');
              const headerSelector = document.getElementById('header-language-selector');
              if (selector) selector.value = lang;
              if (headerSelector) headerSelector.value = lang;
          } catch (error) { console.error("Error al cargar traducciones:", error); }
      }
      function changeLanguage(lang) {
          loadTranslations(lang).then(async () => {
              // Re-renderizar las tarjetas con el nuevo idioma usando la caché de datos
              if (typeof renderCards === 'function' && typeof pedidosCache !== 'undefined') {
                  await renderCards(pedidosCache);
              }
          });
      }
      document.addEventListener('DOMContentLoaded', () => {
          const lang = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
          loadTranslations(lang).then(() => {
              if (typeof setupPageLogic === 'function') {
                  setupPageLogic();
              }
          });
      });
  </script>
  <script src="/assets/globalHeader.js" data-title="PEDIDOS SECUENCIADOS W" data-title-key="header_sequenced_w"></script>
  <!-- ======================= FIN DEL SCRIPT DE TRADUCCIÓN ======================= -->
</body>
</html>
