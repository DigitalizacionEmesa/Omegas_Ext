<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/IMAGENES/favicon_omega.svg" type="image/svg+xml">
    <title data-translate-key="page_title_traceability_c">Trazabilidad C</title>
    <link rel="stylesheet" href="../../assets/styles.css">
    <link rel="stylesheet" href="/assets/loginModal.css">
</head>
<body>
  <!-- Header generado por globalHeader.js -->
  <div class="main-grid" id="cardsGrid" style="display: flex; flex-direction: column; gap: 28px; padding: 40px 0; max-width: 1600px; margin: 0 auto;">
    <!-- Cards se insertan por JS -->
  </div>

  <!-- SCRIPT DE LÓGICA DE LA PÁGINA (VERSIÓN MEJORADA) -->
  <script>
    // ===== CÓDIGO DE VALIDACIÓN DE PERMISOS =====
    async function verificarPermisos() {
        try {
            const usuarioSGA = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
            if (!usuarioSGA.id || !usuarioSGA.nivel) {
                console.log('No hay sesión activa, esperando login...');
                return;
            }
            const nivelUsuario = usuarioSGA.nivel;
            if (nivelUsuario < 1) {
                alert(`❌ Acceso denegado.\n\nNecesitas nivel 1 o superior.\nTu nivel actual: ${nivelUsuario}`);
                window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
                return;
            }
            console.log(`✅ Acceso permitido - OB C Trazabilidad`);
        } catch (error) {
            console.error('Error verificando permisos:', error);
            alert('Error al verificar permisos. Redirigiendo al inicio...');
            window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
        }
    }
    document.addEventListener('DOMContentLoaded', verificarPermisos);
    window.addEventListener('userLoggedIn', verificarPermisos);
    // ===== FIN CÓDIGO DE VALIDACIÓN =====
    
    let pedidosCache = [];
    let lastRenderedPedidosSignature = '';
    const beamWOCache = {}; // Mantenemos la caché para evitar parpadeos si no hay cambios
    const TRACE_REFRESH_INTERVAL_MS = 10000;
    const TRACE_WO_REFRESH_INTERVAL_MS = 15000;

    function formatDate(dateStr) {
      if (!dateStr) return '';
      let dateValue = new Date(dateStr);
      if (isNaN(dateValue.getTime())) {
        dateValue = new Date(String(dateStr).replace(/,/g, ''));
        if (isNaN(dateValue.getTime())) return dateStr;
      }
      const day = String(dateValue.getDate()).padStart(2, '0');
      const month = String(dateValue.getMonth() + 1).padStart(2, '0');
      const year = dateValue.getFullYear();
      return `${day}-${month}-${year}`;
    }

    function buildPedidosSignature(pedidos) {
      return JSON.stringify((pedidos || []).map(pedido => ({
        SalesOrder: pedido.SalesOrder || '',
        Sequence: pedido.Sequence || pedido.SequenceValue || '',
        SubOmega: pedido.SubOmega || pedido.Beam || '',
        SubOmegaQty: pedido.SubOmegaQty ?? pedido.Qty ?? 0,
        ClinchingBeam: pedido.ClinchingBeam || '',
        ClinchingBeamQty: pedido.ClinchingBeamQty ?? 0,
        GuideInterface: pedido.GuideInterface || '',
        GuideInterfaceQty: pedido.GuideInterfaceQty ?? 0,
        Assy: pedido.Assy || '',
        DeliveryDate: pedido.DeliveryDate || '',
        Qty: pedido.Qty || 0,
        DoneQty: pedido.DoneQty ?? 0
      })));
    }

    function buildBarcodeUrl(value) {
      if (!value) return '';
      return `https://bwipjs-api.metafloor.com/?bcid=code39&text=${encodeURIComponent(value)}&scale=4&height=18`;
    }

    function formatComponentQuantity(value) {
      return value === null || value === undefined || value === '' ? 0 : value;
    }

    async function getPedidosSecuenciadosC() {
      try {
        const res = await fetch('/api/pedidos_secuenciados_c_trazabilidad', { cache: 'no-store' });
        if (!res.ok) return [];
        return await res.json();
      } catch (error) {
        console.error("Error fetching sequenced orders:", error);
        return [];
      }
    }

    // --- NUEVA FUNCIÓN ---
    // Esta función se encarga de actualizar solo las WOs de las Beams que están en pantalla.
    async function actualizarWOsDeBeamsVisibles() {
        // 1. Identificar todas las Beams únicas que se están mostrando actualmente.
        const beamElements = document.querySelectorAll('[data-beam-code]');
        const uniqueBeams = Array.from(new Set(Array.from(beamElements)
          .map(el => el.dataset.beamCode)
          .filter(Boolean)));

        if (!uniqueBeams.length) return;

        try {
            const response = await fetch('/api/beam_wos', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ beamCodes: uniqueBeams })
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }

            const batchData = await response.json();

            uniqueBeams.forEach(beamCode => {
              const normalizedWOList = Array.isArray(batchData[beamCode]) ? batchData[beamCode] : [];
              const previousWOList = beamWOCache[beamCode] || [];
              const woContainers = document.querySelectorAll(`[data-wo-container-for="${beamCode}"]`);
              const barcodeImages = document.querySelectorAll(`[data-barcode-for="${beamCode}"]`);
              const recentWO = normalizedWOList.slice(0, 3).join(', ') || '-';
              const firstWO = normalizedWOList.length > 0 ? normalizedWOList[0] : '';
              const previousRecentWO = previousWOList.slice(0, 3).join(', ') || '-';
              const previousFirstWO = previousWOList.length > 0 ? previousWOList[0] : '';

              beamWOCache[beamCode] = normalizedWOList;

              if (recentWO !== previousRecentWO) {
                woContainers.forEach(container => {
                  if (container.textContent !== recentWO) {
                    container.textContent = recentWO;
                  }
                });
              }

              if (firstWO !== previousFirstWO) {
                const barcodeUrl = buildBarcodeUrl(firstWO);
                barcodeImages.forEach(img => {
                  if ((img.dataset.barcodeValue || '') !== firstWO) {
                    img.dataset.barcodeValue = firstWO;
                    img.src = barcodeUrl;
                  }
                });
              }
            });
        } catch (error) {
            console.error('Error actualizando WOs de beams visibles:', error);
        }
    }

    function renderCards(pedidos, options = {}) {
      const { force = false } = options;
      const sorted = Array.isArray(pedidos) ? [...pedidos] : [];
      const nextSignature = buildPedidosSignature(sorted);

      if (!force && nextSignature === lastRenderedPedidosSignature) {
        return;
      }

      lastRenderedPedidosSignature = nextSignature;
      pedidosCache = sorted;
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      if (!sorted.length) {
        grid.innerHTML = `<div style="text-align:center;color:#3456a1;margin-top:40px;">${getTranslation('text_no_c_orders')}</div>`;
        return;
      }
      
      sorted.forEach((pedido, idx) => {
        const card = document.createElement('div');
        card.className = 'secuenciacion-card';
        card.style = `background: #f4f8ff; border-radius: 18px; box-shadow: 0 6px 24px rgba(0,91,170,0.15); display: flex; flex-direction: column; gap: 0; padding: 0; min-height: 0; font-size: 1rem; font-weight: 600; position:relative; border-left: 8px solid #1976d2; margin: 0; width: 100%; max-width: 1560px;`;
        const subOmegaCode = pedido.SubOmega || pedido.Beam || '';
        const cachedWOList = beamWOCache[subOmegaCode] || [];
        const recentWO = cachedWOList.slice(0, 3).join(', ') || 'Cargando...';
        const firstWO = cachedWOList.length > 0 ? cachedWOList[0] : '';
        const barcodeUrl = buildBarcodeUrl(firstWO);
        
        card.innerHTML = `
          <div class="trace-card-header">
            <span class="trace-card-meta">${getTranslation('card_label_sequence')} ${pedido.Sequence || ''}</span>
            <span class="trace-card-meta">${getTranslation('card_label_order')} ${pedido.SalesOrder || ''}</span>
          </div>
          <div class="trace-card-body">
            <div class="pedido-info-container trace-card-cell trace-card-cell--code">
                <span>${getTranslation('card_label_sub_omega')}</span>
                <div data-beam-code="${subOmegaCode}">${subOmegaCode}</div>
            </div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--mini">
              <span>${getTranslation('card_label_sub_omega_qty')}</span>
              <div>${formatComponentQuantity(pedido.SubOmegaQty ?? pedido.Qty)}</div>
            </div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--code">
                <span>${getTranslation('table_header_beam')}</span>
                <div>${pedido.ClinchingBeam || '-'}</div>
            </div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--mini">
              <span>${getTranslation('card_label_beam_qty')}</span>
              <div>${formatComponentQuantity(pedido.ClinchingBeamQty)}</div>
            </div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--code trace-card-cell--catalog">
              <span>${getTranslation('card_label_guide_int')}</span>
              <div>${pedido.GuideInterface || '-'}</div>
            </div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--mini">
              <span>${getTranslation('card_label_guide_int_qty')}</span>
              <div>${formatComponentQuantity(pedido.GuideInterfaceQty)}</div>
            </div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--mini">
              <span>${getTranslation('card_label_done_qty')}</span>
              <div>${(pedido.DoneQty === 0 || pedido.DoneQty === '0' || pedido.DoneQty === null || pedido.DoneQty === undefined || pedido.DoneQty === '') ? 0 : pedido.DoneQty}</div>
            </div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--wo">
              <span>${getTranslation('card_label_wo_sub_omega')}</span>
              <div data-wo-container-for="${subOmegaCode}">${recentWO}</div>
            </div>
            <div class="pedido-info-container trace-card-cell trace-card-barcode">
              <span>${getTranslation('barcode_label')}</span>
              <div class="trace-card-barcode-frame">
                <img data-barcode-for="${subOmegaCode}" data-barcode-value="${firstWO}" class="trace-card-barcode-image" alt="barcode" src="${barcodeUrl}" />
              </div>
            </div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--code">
                <span>${getTranslation('table_header_assy')}</span>
                <div>${pedido.Assy || ''}</div>
            </div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--date">
              <span>${getTranslation('card_label_delivery_date')}</span>
              <div>${pedido.DeliveryDate ? formatDate(pedido.DeliveryDate) : ''}</div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      // Después de renderizar todas las tarjetas, actualizamos las WOs por primera vez.
      actualizarWOsDeBeamsVisibles();
    }

    async function autoUpdatePedidosSecuenciadosC() {
      const pedidos = await getPedidosSecuenciadosC();
      renderCards(pedidos);
    }
    
    // --- FUNCIÓN DE INICIO MODIFICADA ---
    function setupPageLogic() {
        // Llama a la función que actualiza la lista de pedidos cada 5 segundos
        autoUpdatePedidosSecuenciadosC();
        setInterval(() => {
          if (!document.hidden) {
            autoUpdatePedidosSecuenciadosC();
          }
        }, TRACE_REFRESH_INTERVAL_MS);

        // Llama a la NUEVA función que actualiza solo las WOs de las Beams cada 5.5 segundos
        // Se usa un pequeño desfase (5.5s vs 5s) para evitar que todas las llamadas se hagan al mismo tiempo.
        setInterval(() => {
          if (!document.hidden) {
            actualizarWOsDeBeamsVisibles();
          }
        }, TRACE_WO_REFRESH_INTERVAL_MS);

        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) {
            autoUpdatePedidosSecuenciadosC();
            actualizarWOsDeBeamsVisibles();
          }
        });
    }
  </script>

  <!-- ESTILOS ADICIONALES -->
  <style>
    .pedido-info-container{align-self:stretch;background:#fff;border:1px solid #dce7fb;border-radius:10px;margin:0;display:flex;flex-direction:column;justify-content:center;padding:10px 12px;align-items:center;box-shadow:0 2px 8px rgba(0,91,170,.08);font-size:1rem;font-weight:600;min-height:78px;min-width:0}.pedido-info-container span{color:#1976d2;font-weight:700;font-size:.84rem;margin-bottom:4px;letter-spacing:.04em;text-align:center;line-height:1.15}.pedido-info-container div{color:#3456a1;font-size:1rem;font-weight:700;letter-spacing:.01em;text-align:center;line-height:1.22;overflow-wrap:normal;word-break:normal}.secuenciacion-card{transition:box-shadow .2s,border-color .2s;display:flex;flex-direction:column}.secuenciacion-card:hover{box-shadow:0 8px 28px rgba(0,91,170,.18);border-left:8px solid #005baa}
    .main-grid{display:flex;flex-direction:column;gap:16px;padding:14px clamp(10px,2vw,24px) 24px;max-width:1600px;margin:0 auto}

    @media (max-width:1440px){.trace-card-body{grid-template-columns:repeat(6,minmax(110px,1fr));}.trace-card-barcode{grid-column:span 2}.pedido-info-container{min-height:70px}}
    @media (max-width:900px){.main-grid{padding:14px 10px 20px}.trace-card-header{padding:10px 14px}.trace-card-meta{font-size:.96rem}.trace-card-body{grid-template-columns:repeat(3,minmax(110px,1fr));padding:10px}.trace-card-barcode{grid-column:span 3}.pedido-info-container span{font-size:.78rem}.pedido-info-container div{font-size:.92rem}}
    @media (max-width:640px){.trace-card-body{grid-template-columns:repeat(2,minmax(110px,1fr))}.trace-card-barcode{grid-column:span 2}.pedido-info-container{min-height:64px;padding:7px 8px}}
    @media (max-width:420px){.trace-card-header{padding:8px 10px}.trace-card-meta{font-size:.88rem}.trace-card-body{grid-template-columns:1fr;padding:8px}.trace-card-barcode{grid-column:auto}.pedido-info-container{min-height:60px}.trace-card-barcode-image{max-width:100%}}
  </style>

  <!-- ======================= INICIO DEL SCRIPT DE TRADUCCIÓN ======================= -->
  <script>
      
      let currentTranslations = {};
      function getTranslation(key) { return currentTranslations[key] || key; }
      function applyTranslations(translations) {
          currentTranslations = translations;
          document.querySelectorAll('[data-translate-key]').forEach(el => { if (translations[el.getAttribute('data-translate-key')]) el.innerHTML = translations[el.getAttribute('data-translate-key')]; });
          document.querySelectorAll('[data-translate-key-title]').forEach(el => { if (translations[el.getAttribute('data-translate-key-title')]) el.setAttribute('title', translations[el.getAttribute('data-translate-key-title')]); });
      }
      async function loadTranslations(lang) {
          try {
              const response = await fetch(`/translations/translation_${lang}.json`);
              if (!response.ok) { if (lang !== 'es') await loadTranslations('es'); return; }
              const translations = await response.json();
              applyTranslations(translations);
              document.documentElement.lang = lang;
              localStorage.setItem('language', lang);
              // Sincronizar ambos selectores
              const selector = document.getElementById('language-selector');
              const headerSelector = document.getElementById('header-language-selector');
              if (selector) selector.value = lang;
              if (headerSelector) headerSelector.value = lang;
          } catch (error) { console.error("Error al cargar traducciones:", error); }
      }
      function changeLanguage(lang) {
          loadTranslations(lang).then(() => {
              // Re-renderizar las tarjetas con el nuevo idioma
              if (typeof renderCards === 'function' && typeof pedidosCache !== 'undefined') {
              renderCards(pedidosCache, { force: true });
              }
          });
      }
      document.addEventListener('DOMContentLoaded', () => {
          const lang = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
          loadTranslations(lang).then(() => {
              if (typeof setupPageLogic === 'function') {
                  setupPageLogic();
              }
          });
      });
  </script>
  <script src="/assets/globalHeader.js" data-title="TRAZABILIDAD C" data-title-key="header_trazability_orders_c"></script>
  <!-- ======================= FIN DEL SCRIPT DE TRADUCCIÓN ======================= -->
</body>
</html>
