<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title data-translate-key="page_title_tie_brackets">Tie Brackets</title>
    <link rel="stylesheet" href="../../assets/styles.css">
    <link rel="stylesheet" href="/assets/loginModal.css">
</head>
<body>
  <!-- Header generado por globalHeader.js -->
  <div style="display:flex;justify-content:center;gap:14px;padding:24px 0 0 0;max-width:1200px;margin:0 auto;">
    <button id="toggleNoFabricados" type="button" data-translate-key="tie_brackets_filter_not_fabricated" onclick="setFiltroFabricado('no_fabricados')" style="padding:12px 22px;border-radius:999px;border:2px solid #1976d2;background:#1976d2;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;">No fabricados</button>
    <button id="toggleFabricados" type="button" data-translate-key="tie_brackets_filter_fabricated" onclick="setFiltroFabricado('fabricados')" style="padding:12px 22px;border-radius:999px;border:2px solid #1976d2;background:#fff;color:#1976d2;font-size:1rem;font-weight:700;cursor:pointer;">Fabricados</button>
  </div>
  <div style="max-width:1200px;margin:14px auto 0 auto;padding:0 12px;">
    <input id="buscadorPedidos" type="search" data-translate-key-placeholder="tie_brackets_search_placeholder" placeholder="Buscar pedido, secuencia, tie bracket, extensor o assy" oninput="actualizarBusqueda(this.value)" style="width:100%;padding:14px 18px;border:2px solid #d6e2f5;border-radius:14px;font-size:1rem;color:#3456a1;background:#fff;box-shadow:0 4px 14px rgba(0,91,170,.08);outline:none;">
  </div>
  <div class="main-grid" id="cardsGrid" style="display: flex; flex-direction: column; gap: 28px; padding: 40px 0; max-width: 1200px; margin: 0 auto;">
    <!-- Cards se insertan por JS -->
  </div>

  <script>
    // ===== CÓDIGO DE VALIDACIÓN DE PERMISOS =====
    async function verificarPermisos() {
        try {
            // Obtener datos del usuario desde localStorage
            const usuarioSGA = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');
            
            if (!usuarioSGA.id || !usuarioSGA.nivel) {
                console.log('No hay sesión activa, esperando login...');
                return;
            }
            
            const nivelUsuario = usuarioSGA.nivel;
            
            console.log(`🔍 Verificando permisos - Usuario: ${usuarioSGA.nombre}, Nivel: ${nivelUsuario}`);
            
            // Esta pantalla requiere nivel 1 (acceso básico)
            if (nivelUsuario < 1) {
                alert(`❌ Acceso denegado.\n\nNecesitas nivel 1 o superior para acceder a esta sección.\nTu nivel actual: ${nivelUsuario}`);
                window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
                return;
            }
            
            console.log(`✅ Acceso permitido - Tie Brackets`);
            
        } catch (error) {
            console.error('Error verificando permisos:', error);
            alert('Error al verificar permisos. Redirigiendo al inicio...');
            window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
        }
    }

    // Ejecutar verificación al cargar la página
    document.addEventListener('DOMContentLoaded', verificarPermisos);
    
    // Escuchar evento de login exitoso
    window.addEventListener('userLoggedIn', verificarPermisos);
    
    let pedidosCache = [];
    let extendersCache = {};
    let descuentoCache = {};
    let filtroFabricadoActual = localStorage.getItem('tieBracketsFiltroFabricado') || 'no_fabricados';
    let busquedaActual = localStorage.getItem('tieBracketsBusqueda') || '';

    function getFabricadoStorageKey(pedido) {
      const salesOrder = pedido?.SalesOrder || '';
      const assy = pedido?.Assy || '';
      const tieBracket = pedido?.TieBracket || '';
      return `tie_brackets_fabricado_${salesOrder}_${assy}_${tieBracket}`;
    }

    function estaFabricado(pedido) {
      return localStorage.getItem(getFabricadoStorageKey(pedido)) === '1';
    }

    function guardarEstadoFabricado(pedido, fabricado) {
      localStorage.setItem(getFabricadoStorageKey(pedido), fabricado ? '1' : '0');
    }

    function setFiltroFabricado(filtro) {
      filtroFabricadoActual = filtro;
      localStorage.setItem('tieBracketsFiltroFabricado', filtro);
      actualizarToggleFiltro();
      renderCards(pedidosCache);
    }

    function actualizarBusqueda(valor) {
      busquedaActual = (valor || '').trim().toLowerCase();
      localStorage.setItem('tieBracketsBusqueda', busquedaActual);
      renderCards(pedidosCache);
    }

    function coincideBusqueda(pedido) {
      if (!busquedaActual) {
        return true;
      }

      const campos = [
        pedido?.SalesOrder,
        pedido?.Sequence,
        pedido?.TieBracket,
        pedido?.Extender,
        pedido?.Assy
      ];

      return campos.some(valor => String(valor || '').toLowerCase().includes(busquedaActual));
    }

    function actualizarToggleFiltro() {
      const botonNoFabricados = document.getElementById('toggleNoFabricados');
      const botonFabricados = document.getElementById('toggleFabricados');
      const esNoFabricados = filtroFabricadoActual === 'no_fabricados';

      if (botonNoFabricados) {
        botonNoFabricados.style.background = esNoFabricados ? '#1976d2' : '#fff';
        botonNoFabricados.style.color = esNoFabricados ? '#fff' : '#1976d2';
      }

      if (botonFabricados) {
        botonFabricados.style.background = esNoFabricados ? '#fff' : '#2e7d32';
        botonFabricados.style.borderColor = esNoFabricados ? '#1976d2' : '#2e7d32';
        botonFabricados.style.color = esNoFabricados ? '#1976d2' : '#fff';
      }
    }

    function toggleFabricadoCard(salesOrder, assy, tieBracket) {
      const pedido = pedidosCache.find(item =>
        String(item.SalesOrder || '') === String(salesOrder || '')
        && String(item.Assy || '') === String(assy || '')
        && String(item.TieBracket || '') === String(tieBracket || '')
      );

      if (!pedido) {
        return;
      }

      guardarEstadoFabricado(pedido, !estaFabricado(pedido));
      renderCards(pedidosCache);
    }

    async function getPedidosTieBrackets() {
      const res = await fetch('/api/pedidos_tb');
      if (!res.ok) return [];
      return await res.json();
    }

    async function obtenerExtendersDelPedido(numeroPedido) {
      if (extendersCache[numeroPedido]) {
        return extendersCache[numeroPedido];
      }

      try {
        const res = await fetch(`/api/obtener-extenders-pedido?numero_pedido=${encodeURIComponent(numeroPedido)}`);
        if (!res.ok) {
          return { assy_extensores: [] };
        }
        const data = await res.json();
        extendersCache[numeroPedido] = data;
        return data;
      } catch (error) {
        console.error(`Error obteniendo extensores: ${error}`);
        return { assy_extensores: [] };
      }
    }

    // Nueva función: obtener info del material de descuento para un pedido
    async function obtenerMaterialDescuentoPedido(numeroPedido) {
      // Si ya está en caché, devolver
      if (descuentoCache.hasOwnProperty(numeroPedido)) {
        return descuentoCache[numeroPedido];
      }
      
      try {
        const res = await fetch(`/api/obtener-material-descuento-pedido?numero_pedido=${encodeURIComponent(numeroPedido)}`);
        if (!res.ok) {
          console.warn(`No se pudo obtener material de descuento para pedido ${numeroPedido}`);
          return { assy_descuento: null };
        }
        const data = await res.json();
        descuentoCache[numeroPedido] = data;
        return data;
      } catch (error) {
        console.error(`Error obteniendo material de descuento: ${error}`);
        return { assy_descuento: null };
      }
    }

    function esAssynExtensor(assy, extendersData) {
      if (!extendersData || !extendersData.assy_extensores) return false;
      return extendersData.assy_extensores.some(ext => ext.toUpperCase() === (assy || '').toUpperCase());
    }

    // Nueva función: verificar si un Assy es el material de descuento
    function esAssynDescuento(assy, descuentoData) {
      if (!descuentoData || !descuentoData.assy_descuento) return false;
      return (assy || '').toUpperCase() === descuentoData.assy_descuento.toUpperCase();
    }

    async function actualizarCantidadesExtender() {
      const extenderQtyNodes = Array.from(document.querySelectorAll('.extender-qty-value'));
      const pedidos = [...new Set(extenderQtyNodes.map(node => node.dataset.salesOrder).filter(Boolean))];

      // Obtener datos del material de descuento (OmegaType)
      await Promise.all(pedidos.map(obtenerMaterialDescuentoPedido));

      extenderQtyNodes.forEach(node => {
        const salesOrder = node.dataset.salesOrder || '';
        const assy = (node.dataset.assy || '').toUpperCase();
        const qty = Number(node.dataset.qty || 0);
        const descuentoData = descuentoCache[salesOrder] || { assy_descuento: null };
        
        // Comparar si este Assy es el material de descuento (OmegaType)
        const esAssynDescuento = descuentoData.assy_descuento && assy === descuentoData.assy_descuento.toUpperCase();
        node.textContent = esAssynDescuento ? Math.max(0, qty - 2) : '-';
      });
    }

    function renderCards(pedidos) {
      // Orden estable: PriorityOrder asc si existe; si no, por parte numérica de Sequence asc
      function parseSeq(val) {
        if (val === null || val === undefined) return Number.POSITIVE_INFINITY;
        const m = String(val).match(/\d+/g);
        if (!m || m.length === 0) return Number.POSITIVE_INFINITY;
        // Usar el último bloque numérico por seguridad (e.g., ES1-021)
        return parseInt(m[m.length - 1], 10);
      }
      function compareOrders(a, b) {
        const pa = (typeof a.PriorityOrder === 'number') ? a.PriorityOrder : null;
        const pb = (typeof b.PriorityOrder === 'number') ? b.PriorityOrder : null;
        if (pa !== null && pb !== null) return pa - pb;
        const sa = parseSeq(a.Sequence || a.SequenceValue);
        const sb = parseSeq(b.Sequence || b.SequenceValue);
        if (sa !== sb) return sa - sb;
        return 0;
      }
      const sorted = Array.isArray(pedidos) ? [...pedidos].sort(compareOrders) : [];
      pedidosCache = sorted;
      actualizarToggleFiltro();
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      const filtrados = sorted.filter(pedido => {
        const fabricado = estaFabricado(pedido);
        const cumpleFabricado = filtroFabricadoActual === 'fabricados' ? fabricado : !fabricado;
        return cumpleFabricado && coincideBusqueda(pedido);
      });

      if (!filtrados.length) {
        const vacio = document.createElement('div');
        vacio.textContent = filtroFabricadoActual === 'fabricados'
          ? getTranslation('text_no_tb_orders_fabricated')
          : getTranslation('text_no_tb_orders');
        vacio.style.textAlign = 'center';
        vacio.style.color = '#3456a1';
        vacio.style.marginTop = '40px';
        grid.appendChild(vacio);
        return;
      }
      // Los pedidos ya vienen ordenados correctamente del backend con PriorityOrder
      filtrados.forEach((pedido, idx) => {
        const fabricado = estaFabricado(pedido);
        const colorPrincipal = fabricado ? '#2e7d32' : '#1976d2';
        const colorSecundario = fabricado ? '#2f5f35' : '#3456a1';
        const colorBordeSuave = fabricado ? '#dcefdc' : '#e3eafc';
        const fondoCard = fabricado ? '#f3fbf3' : '#f4f8ff';
        const fabricadoLabel = fabricado ? getTranslation('status_mark_not_fabricated_display') : getTranslation('status_mark_fabricated_display');
        const fabricadoTooltip = fabricado ? getTranslation('status_mark_not_fabricated_tooltip') : getTranslation('status_mark_fabricated_tooltip');
        const fabricadoEstadoTexto = fabricado ? getTranslation('status_mark_not_fabricated_help') : getTranslation('status_mark_fabricated_help');
        const card = document.createElement('div');
        card.className = 'secuenciacion-card';
        card.style = `background: ${fondoCard}; border-radius: 22px; box-shadow: 0 8px 32px rgba(0,91,170,0.18); display: flex; flex-direction: column; gap: 0; padding: 0; min-height: 260px; font-size: 1.5rem; font-weight: 600; position:relative; border-left: 14px solid ${colorPrincipal}; margin: 0; width: 100%; max-width: 1700px;`;

        card.innerHTML = `
          <div style="background:${colorPrincipal};color:white;padding:22px 34px 16px 34px;border-radius:10px 22px 0 0;display:flex;align-items:center;justify-content:space-between;gap:20px;">
            <span style="font-size:2.2rem;font-weight:700;letter-spacing:2px;">${getTranslation('card_label_sequence')} ${pedido.Sequence || ''}</span>
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end;">
              <div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:126px;">
                <button
                  type="button"
                  class="status-action-button"
                  title="${fabricadoTooltip}"
                  aria-label="${fabricadoTooltip}"
                  style="--status-color:${fabricado ? '#e74c3c' : '#27ae60'};--status-color-dark:${fabricado ? '#7f1d1d' : '#14532d'};"
                  onclick="toggleFabricadoCard('${String(pedido.SalesOrder || '').replace(/'/g, "\\'")}', '${String(pedido.Assy || '').replace(/'/g, "\\'")}', '${String(pedido.TieBracket || '').replace(/'/g, "\\'")}')"
                >
                  ${fabricadoLabel}
                </button>
                <span style="font-size:.64rem;font-weight:700;letter-spacing:.3px;color:#f4fbff;opacity:.95;margin-left:12px;">
                  ${fabricadoEstadoTexto}
                </span>
              </div>
              <span style="font-size:1.9rem;font-weight:600;white-space:nowrap;">${getTranslation('card_label_order')} ${pedido.SalesOrder || ''}</span>
            </div>
          </div>
          <div style="display:flex;flex-wrap:nowrap;gap:38px;padding:28px 64px 0 64px;justify-content:center;">
            <div class="pedido-info-container pedido-info-top" style="border-color:${colorBordeSuave};"><span style="color:${colorPrincipal};">${getTranslation('card_label_tie_bracket')}</span><div style="color:${colorSecundario};">${pedido.TieBracket || '-'}</div></div>
            <div class="pedido-info-container pedido-info-top" style="border-color:${colorBordeSuave};"><span style="color:${colorPrincipal};">${getTranslation('card_label_extender')}</span><div style="color:${colorSecundario};">${pedido.Extender || '-'}</div></div>
          </div>
          <div style="display:flex;flex-wrap:nowrap;gap:38px;padding:18px 64px 38px 64px;justify-content:center;align-items:center;">
            <div class="pedido-info-container pedido-info-bottom" style="border-color:${colorBordeSuave};"><span style="color:${colorPrincipal};">${getTranslation('card_label_qty')}</span><div style="color:${colorSecundario};">${pedido.Qty || ''}</div></div>
            <div class="pedido-info-container pedido-info-bottom" style="border-color:${colorBordeSuave};"><span style="color:${colorPrincipal};">${getTranslation('card_label_extender_qty')}</span><div class="extender-qty-value" style="color:${colorSecundario};" data-assy="${pedido.Assy || ''}" data-sales-order="${pedido.SalesOrder}" data-qty="${pedido.Qty}">-</div></div>
          </div>
        `;
        grid.appendChild(card);
      });

      actualizarCantidadesExtender();
    }

    function setupPageLogic() {
        async function autoUpdate() {
            const pedidos = await getPedidosTieBrackets();
            renderCards(pedidos);
        }
        autoUpdate();
        setInterval(autoUpdate, 5000);
    }
  </script>

  <!-- ESTILOS ADICIONALES -->
  <style>
    .status-action-button{--status-color:#27ae60;--status-color-dark:#14532d;background:linear-gradient(135deg,color-mix(in srgb,var(--status-color) 92%,#fff 8%),var(--status-color));color:#fff;border:2px solid color-mix(in srgb,var(--status-color-dark) 60%,#fff 40%);border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:800;font-size:.8rem;line-height:1.1;transition:transform .18s,filter .18s,box-shadow .18s,background .18s;min-width:128px;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.16);text-transform:uppercase;letter-spacing:.35px}.status-action-button:hover{filter:brightness(1.06);transform:translateY(-1px) scale(1.02);box-shadow:0 10px 18px rgba(0,0,0,.2)}
    .pedido-info-container{align-self:center;background:#fff;border:2.5px solid #e3eafc;border-radius:14px;min-width:180px;max-width:200px;height:100px;margin:0;display:flex;flex-direction:column;padding-left:10px;padding-right:10px;align-items:center;box-shadow:0 4px 16px rgba(0,91,170,.1);font-size:1.5rem;font-weight:600}.pedido-info-top{font-size:1.5rem}.pedido-info-bottom{font-size:2rem}.pedido-info-container span{color:#1976d2;font-weight:700;font-size:1.8rem;margin-bottom:10px;letter-spacing:2px}.pedido-info-container div{color:#3456a1;font-size:1.6rem;font-weight:700;letter-spacing:1px;text-align:center}.secuenciacion-card{transition:box-shadow .2s,border-color .2s}.secuenciacion-card:hover{box-shadow:0 8px 32px rgba(0,91,170,.22);border-left:10px solid #005baa}@media (max-width:900px){.main-grid{padding:20px 0}.secuenciacion-card>div{padding-left:16px!important;padding-right:16px!important}.pedido-info-container{min-width:100px;padding:8px;font-size:.95rem}}@media (max-width:600px){.main-grid{padding:10px 0}.secuenciacion-card>div{padding-left:8px!important;padding-right:8px!important}.pedido-info-container{min-width:80px;padding:6px;font-size:.92rem}}
  </style>

  <!-- ======================= INICIO DEL SCRIPT DE TRADUCCIÓN ======================= -->
  <script>
      
      let currentTranslations = {};
      function getTranslation(key) { return currentTranslations[key] || key; }
      function applyTranslations(translations) {
          currentTranslations = translations;
          document.querySelectorAll('[data-translate-key]').forEach(el => { if (translations[el.getAttribute('data-translate-key')]) el.innerHTML = translations[el.getAttribute('data-translate-key')]; });
          document.querySelectorAll('[data-translate-key-title]').forEach(el => { if (translations[el.getAttribute('data-translate-key-title')]) el.setAttribute('title', translations[el.getAttribute('data-translate-key-title')]); });
          document.querySelectorAll('[data-translate-key-placeholder]').forEach(el => { if (translations[el.getAttribute('data-translate-key-placeholder')]) el.setAttribute('placeholder', translations[el.getAttribute('data-translate-key-placeholder')]); });
      }
      async function loadTranslations(lang) {
          try {
              const response = await fetch(`/translations/translation_${lang}.json`);
              if (!response.ok) { if (lang !== 'es') await loadTranslations('es'); return; }
              const translations = await response.json();
              applyTranslations(translations);
              document.documentElement.lang = lang;
              localStorage.setItem('language', lang);
              // Sincronizar ambos selectores
              const selector = document.getElementById('language-selector');
              const headerSelector = document.getElementById('header-language-selector');
              if (selector) selector.value = lang;
              if (headerSelector) headerSelector.value = lang;
          } catch (error) { console.error("Error al cargar traducciones:", error); }
      }
      function changeLanguage(lang) {
          loadTranslations(lang).then(() => {
              // Re-renderizar las tarjetas con el nuevo idioma usando la caché de datos
              if (typeof renderCards === 'function' && typeof pedidosCache !== 'undefined') {
                  renderCards(pedidosCache);
              }
          });
      }
      document.addEventListener('DOMContentLoaded', () => {
          const lang = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
          actualizarToggleFiltro();
          const buscadorPedidos = document.getElementById('buscadorPedidos');
          if (buscadorPedidos) {
            buscadorPedidos.value = busquedaActual;
          }
          loadTranslations(lang).then(() => {
              if (typeof setupPageLogic === 'function') {
                  setupPageLogic();
              }
          });
      });
  </script>
  <script src="/assets/globalHeader.js" data-title="TIE BRACKETS" data-title-key="header_tie_brackets"></script>
  <!-- ======================= FIN DEL SCRIPT DE TRADUCCIÓN ======================= -->
</body>
</html>
