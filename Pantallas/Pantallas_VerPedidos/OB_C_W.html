<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/IMAGENES/favicon_omega.svg" type="image/svg+xml">
    <title data-translate-key="page_title_sequenced_cw">Pedidos Secuenciados C + W</title>
    <link rel="stylesheet" href="../../assets/styles.css">
    <link rel="stylesheet" href="/assets/loginModal.css">
</head>
<body>
  <!-- Header generado por globalHeader.js -->
  <div class="main-grid" id="cardsGrid" style="display: flex; flex-direction: column; gap: 28px; padding: 40px 0; max-width: 1840px; margin: 0 auto;">
    <!-- Cards se insertan por JS -->
  </div>

  <script>
    // ===== CÓDIGO DE VALIDACIÓN DE PERMISOS =====
    async function verificarPermisos() {
        try {
            // Obtener datos del usuario desde localStorage
            const usuarioSGA = JSON.parse(localStorage.getItem('usuarioSGA') || '{}');

            if (!usuarioSGA.id || !usuarioSGA.nivel) {
                console.log('No hay sesión activa, esperando login...');
                return;
            }

            const nivelUsuario = usuarioSGA.nivel;

            console.log(`🔍 Verificando permisos - Usuario: ${usuarioSGA.nombre}, Nivel: ${nivelUsuario}`);

            // Esta pantalla requiere nivel 1 (acceso básico)
            if (nivelUsuario < 1) {
                alert(`❌ Acceso denegado.\n\nNecesitas nivel 1 o superior para acceder a esta sección.\nTu nivel actual: ${nivelUsuario}`);
                window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
                return;
            }

            console.log(`✅ Acceso permitido - OB C + W`);

        } catch (error) {
            console.error('Error verificando permisos:', error);
            alert('Error al verificar permisos. Redirigiendo al inicio...');
            window.location.href = '/Pantallas/Pantallas_Generales/Pantalla_INICIO.html';
        }
    }

    // Ejecutar verificación al cargar la página
    document.addEventListener('DOMContentLoaded', verificarPermisos);

    // Escuchar evento de login exitoso
    window.addEventListener('userLoggedIn', verificarPermisos);

    let pedidosCache = [];
    let lastRenderedPedidosSignature = '';
    const VIEW_REFRESH_INTERVAL_MS = 10000;

    function formatDate(dateStr) {
      if (!dateStr) return '';
      let dateValue = new Date(dateStr);
      if (isNaN(dateValue.getTime())) {
        dateValue = new Date(String(dateStr).replace(/,/g, ''));
        if (isNaN(dateValue.getTime())) return dateStr;
      }
      const day = String(dateValue.getDate()).padStart(2, '0');
      const month = String(dateValue.getMonth() + 1).padStart(2, '0');
      const year = dateValue.getFullYear();
      return `${day}-${month}-${year}`;
    }

    function formatExtenderQuantity(value) {
      return value === null || value === undefined || value === '' ? '-' : value;
    }

    function formatComponentQuantity(value) {
      return value === null || value === undefined || value === '' ? 0 : value;
    }

    function formatOptionalQuantity(value) {
      return value === null || value === undefined || value === '' ? '-' : value;
    }

    function buildBarcodeUrl(value) {
      if (!value) return '';
      return `https://bwipjs-api.metafloor.com/?bcid=code39&text=${encodeURIComponent(value)}&scale=4&height=18`;
    }

    function buildPedidosSignature(pedidos) {
      return JSON.stringify((pedidos || []).map(pedido => ({
        tipo: pedido.tipo || '',
        SalesOrder: pedido.SalesOrder || '',
        Sequence: pedido.Sequence || pedido.SequenceValue || '',
        Assy: pedido.Assy || '',
        Qty: pedido.Qty || 0,
        DoneQty: pedido.DoneQty ?? 0,
        Beam: pedido.Beam || '',
        BeamQty: pedido.BeamQty ?? 0,
        IF1: pedido.IF1 || '',
        IF2: pedido.IF2 || '',
        IFQty: pedido.IFQty ?? 0,
        Extender: pedido.Extender || '',
        ExtenderQuantity: pedido.ExtenderQuantity ?? null,
        DeliveryDate: pedido.DeliveryDate || '',
        TieBracket: pedido.TieBracket || '',
        TieBracketQty: pedido.TieBracketQty ?? null,
        TieExtenderQty: pedido.TieExtenderQty ?? null,
        PitBracket: pedido.PitBracket || '',
        PitBracketQty: pedido.PitBracketQty ?? null,
        WO: pedido.WO || '',
        PriorityOrder: pedido.PriorityOrder ?? null
      })));
    }

    async function getPedidosCombinados() {
      let cRes, wRes;
      try {
        [cRes, wRes] = await Promise.all([
          fetch('/api/pedidos_secuenciados_c', { cache: 'no-store' }),
          fetch('/api/pedidos_secuenciados_w', { cache: 'no-store' })
        ]);
      } catch (error) {
        console.error('Error al obtener pedidos C/W:', error);
        return [];
      }

      const cPedidos = (cRes && cRes.ok) ? await cRes.json().catch(() => []) : [];
      const wPedidos = (wRes && wRes.ok) ? await wRes.json().catch(() => []) : [];

      const items = [
        ...(Array.isArray(cPedidos) ? cPedidos : []).map(p => ({ ...p, tipo: 'C' })),
        ...(Array.isArray(wPedidos) ? wPedidos : []).map(p => ({ ...p, tipo: 'W' }))
      ];

      // Orden estable: PriorityOrder asc si existe; si no, por parte numérica de Sequence asc
      function parseSeq(val) {
        if (val === null || val === undefined) return Number.POSITIVE_INFINITY;
        const m = String(val).match(/\d+/g);
        if (!m || m.length === 0) return Number.POSITIVE_INFINITY;
        return parseInt(m[m.length - 1], 10);
      }
      function compareOrders(a, b) {
        const pa = (typeof a.PriorityOrder === 'number') ? a.PriorityOrder : null;
        const pb = (typeof b.PriorityOrder === 'number') ? b.PriorityOrder : null;
        if (pa !== null && pb !== null) return pa - pb;
        const sa = parseSeq(a.Sequence || a.SequenceValue);
        const sb = parseSeq(b.Sequence || b.SequenceValue);
        if (sa !== sb) return sa - sb;
        const tipoOrder = { C: 0, W: 1 };
        const ta = tipoOrder[a.tipo] ?? 2;
        const tb = tipoOrder[b.tipo] ?? 2;
        return ta - tb;
      }

      return items.sort(compareOrders);
    }

    function groupBySalesOrder(items) {
      const groups = [];
      const groupMap = new Map();

      for (const item of items) {
        const key = String(item.SalesOrder || item.Sequence || '').trim() || `seq-${item.Sequence || ''}`;
        let group = groupMap.get(key);
        if (!group) {
          group = { salesOrder: key, items: [] };
          groupMap.set(key, group);
          groups.push(group);
        }
        group.items.push(item);
      }

      // Dentro de cada grupo: C primero, luego W, manteniendo el orden por secuencia
      const tipoOrder = { C: 0, W: 1 };
      for (const group of groups) {
        group.items.sort((a, b) => {
          const ta = tipoOrder[a.tipo] ?? 2;
          const tb = tipoOrder[b.tipo] ?? 2;
          if (ta !== tb) return ta - tb;
          const sa = String(a.Sequence || '').localeCompare(String(b.Sequence || ''), undefined, { numeric: true });
          return sa;
        });
      }

      return groups;
    }

    function buildCard(pedido, idx) {
      const card = document.createElement('div');
      card.className = 'secuenciacion-card';
      const borderColor = pedido.tipo === 'W' ? '#2e7d32' : '#1976d2';
      card.style = `background: #f4f8ff; border-radius: 18px; box-shadow: 0 6px 24px rgba(0,91,170,0.15); display: flex; flex-direction: column; gap: 0; padding: 0; min-height: 0; font-size: 1rem; font-weight: 600; position:relative; border-left: 8px solid ${borderColor}; margin: 0; width: 100%; max-width: 1800px;`;

      const barcodeImgId = `barcodeimg_${idx}_${String(pedido.SalesOrder || '').replace(/[^a-zA-Z0-9]/g, '')}`;
      const ifValue = pedido.IF1 && pedido.IF2 && pedido.IF1 !== pedido.IF2
        ? `${pedido.IF1} / ${pedido.IF2}`
        : (pedido.IF1 || pedido.IF2 || '');
      const tieBracket = String(pedido.TieBracket || '').trim();
      const hasTieRowData = !!(
        tieBracket
        || pedido.TieBracketQty !== null && pedido.TieBracketQty !== undefined
        || pedido.TieExtenderQty !== null && pedido.TieExtenderQty !== undefined
      );
      const tieRowHtml = hasTieRowData ? `
        <div class="trace-card-secondary">
          <div class="pedido-info-container trace-card-secondary-cell trace-card-secondary-cell--wide"><span>${getTranslation('card_label_tie_bracket')}</span><div>${tieBracket || '-'}</div></div>
          <div class="pedido-info-container trace-card-secondary-cell trace-card-secondary-cell--compact"><span>${getTranslation('card_label_qty')}</span><div>${formatOptionalQuantity(pedido.TieBracketQty)}</div></div>
          <div class="pedido-info-container trace-card-secondary-cell trace-card-secondary-cell--wide"><span>${getTranslation('card_label_extender')}</span><div>${pedido.Extender || '-'}</div></div>
          <div class="pedido-info-container trace-card-secondary-cell trace-card-secondary-cell--compact"><span>${getTranslation('card_label_extender_qty')}</span><div>${formatOptionalQuantity(pedido.TieExtenderQty)}</div></div>
        </div>
      ` : '';

      const badgeClass = pedido.tipo === 'W' ? 'trace-card-badge--w' : 'trace-card-badge--c';
      const badgeText = pedido.tipo === 'W' ? getTranslation('badge_ob_w') : getTranslation('badge_ob_c');

      card.innerHTML = `
        <div class="trace-card-header">
          <span class="trace-card-meta">${getTranslation('card_label_sequence')} ${pedido.Sequence || ''}</span>
          <span class="trace-card-meta">${getTranslation('card_label_order')} ${pedido.SalesOrder || ''}</span>
          <span class="trace-card-badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="trace-card-body">
          <div class="pedido-info-container trace-card-cell trace-card-cell--narrow"><span>${getTranslation('table_header_assy')}</span><div>${pedido.Assy || ''}</div></div>
          <div class="pedido-info-container trace-card-cell trace-card-cell--micro"><span>${getTranslation('card_label_qty')}</span><div>${pedido.Qty || ''}</div></div>
          <div class="pedido-info-container trace-card-cell trace-card-cell--micro"><span>${getTranslation('card_label_done_qty')}</span><div>${(pedido.DoneQty === 0 || pedido.DoneQty === '0' || pedido.DoneQty === null || pedido.DoneQty === undefined || pedido.DoneQty === '') ? 0 : pedido.DoneQty}</div></div>
          <div class="pedido-info-container trace-card-cell trace-card-cell--narrow"><span>${getTranslation('card_label_sub_omega')}</span><div>${pedido.Beam || ''}</div></div>
          <div class="pedido-info-container trace-card-cell trace-card-cell--micro"><span>${getTranslation('card_label_sub_omega_qty')}</span><div>${formatComponentQuantity(pedido.BeamQty)}</div></div>
          <div class="pedido-info-container trace-card-cell trace-card-cell--narrow">
            <span>${getTranslation('card_label_wall_int')}</span>
            <div>${ifValue}</div>
          </div>
          <div class="pedido-info-container trace-card-cell trace-card-cell--micro"><span>${getTranslation('card_label_wall_int_qty')}</span><div>${formatComponentQuantity(pedido.IFQty)}</div></div>
          <div class="pedido-info-container trace-card-cell trace-card-cell--narrow"><span>${getTranslation('card_label_extender')}</span><div>${pedido.Extender || '-'}</div></div>
          <div class="pedido-info-container trace-card-cell trace-card-cell--micro"><span>${getTranslation('card_label_extender_qty')}</span><div>${formatExtenderQuantity(pedido.ExtenderQuantity)}</div></div>
          <div class="pedido-info-container trace-card-cell trace-card-cell--micro"><span>${getTranslation('card_label_label_qty')}</span><div>${formatOptionalQuantity(pedido.PitBracketQty)}</div></div>
          <div class="pedido-info-container trace-card-cell trace-card-cell--date"><span>${getTranslation('card_label_delivery_date')}</span><div>${pedido.DeliveryDate ? formatDate(pedido.DeliveryDate) : ''}</div></div>
          <div class="pedido-info-container trace-card-cell trace-card-cell--wide">
            <span>${getTranslation('card_label_wo')}</span>
            <div>${(pedido.WO || '').replace(/,/g, ', ')}</div>
          </div>
          <div class="pedido-info-container trace-card-cell trace-card-barcode">
            <span>${getTranslation('barcode_label')}</span>
            <div class="trace-card-barcode-frame">
              <img id="${barcodeImgId}" class="trace-card-barcode-image" alt="barcode" src="" />
            </div>
          </div>
        </div>
        ${tieRowHtml}
      `;

      let firstWO = '';
      if (pedido.WO) {
        const woArr = String(pedido.WO).split(',').map(w => w.trim()).filter(w => w);
        if (woArr.length > 0) firstWO = woArr[0];
      }
      const img = card.querySelector(`#${barcodeImgId}`);
      if (img) {
        img.dataset.barcodeValue = firstWO;
        img.src = firstWO ? buildBarcodeUrl(firstWO) : '';
      }

      return card;
    }

    function buildCombinedCard(items, idx) {
      const itemsArr = Array.isArray(items) ? items : [items];
      const hasC = itemsArr.some(i => i.tipo === 'C');
      const hasW = itemsArr.some(i => i.tipo === 'W');
      const isBoth = hasC && hasW;
      const isOnlyC = hasC && !hasW;
      const isOnlyW = hasW && !hasC;
      const headerRef = itemsArr[0] || {};

      const card = document.createElement('div');
      card.className = 'secuenciacion-card secuenciacion-card--combined';
      const borderColor = isOnlyC ? '#9e9e9e' : (isOnlyW ? '#2e7d32' : '#1976d2');
      card.style = `background: #f4f8ff; border-radius: 18px; box-shadow: 0 6px 24px rgba(0,91,170,0.15); display: flex; flex-direction: column; gap: 0; padding: 0; min-height: 0; font-size: 1rem; font-weight: 600; position:relative; border-left: 8px solid ${borderColor}; margin: 0; width: 100%; max-width: 1800px;`;

      // ---- Header (secuencia izq., orden en medio, origen a la derecha con color de tarjeta) ----
      const badgeClass = isBoth ? 'trace-card-badge--src' : (isOnlyC ? 'trace-card-badge--c-src' : 'trace-card-badge--w-src');
      const badgeText = isBoth ? 'OB-C / OB-W' : (isOnlyC ? getTranslation('badge_ob_c') : getTranslation('badge_ob_w'));
      const badgeHtml = `<span class="trace-card-badge ${badgeClass}">${badgeText}</span>`;
      const headerHtml = `
        <div class="trace-card-header">
          <span class="trace-card-meta trace-card-meta--left">${getTranslation('card_label_sequence')} ${headerRef.Sequence || ''}</span>
          <span class="trace-card-meta trace-card-meta--center">${getTranslation('card_label_order')} ${headerRef.SalesOrder || ''}</span>
          ${badgeHtml}
        </div>
      `;

      // ---- Toques en la esquina superior derecha: gris C, verde W, naranja conjunto ----
      const cornerHtml = isOnlyC
        ? `<span class="trace-card-corner-c" aria-hidden="true"></span>`
        : (isOnlyW
            ? `<span class="trace-card-corner-w" aria-hidden="true"></span>`
            : `<span class="trace-card-corner-cw" aria-hidden="true"></span>`);

      // ---- Helper: genera la fila de cuerpo de un pedido (C o W) ----
      const buildBodyHtml = (pedido) => {
        const ifValue = pedido.IF1 && pedido.IF2 && pedido.IF1 !== pedido.IF2
          ? `${pedido.IF1} / ${pedido.IF2}`
          : (pedido.IF1 || pedido.IF2 || '');
        const imgId = `barcodeimg_${idx}_${pedido.tipo}_${String(pedido.SalesOrder || '').replace(/[^a-zA-Z0-9]/g, '')}`;
        const rowClass = pedido.tipo === 'W' ? 'cw-body-row cw-body-row--w' : 'cw-body-row cw-body-row--c';
        const extQty = pedido.ExtenderQuantity;
        return `
          <div class="${rowClass}">
            <div class="trace-card-body-grid">
            <div class="pedido-info-container trace-card-cell trace-card-cell--narrow"><span>${getTranslation('table_header_assy')}</span><div>${pedido.Assy || ''}</div></div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--micro"><span>${getTranslation('card_label_qty')}</span><div>${pedido.Qty || ''}</div></div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--micro"><span>${getTranslation('card_label_done_qty')}</span><div>${(pedido.DoneQty === 0 || pedido.DoneQty === '0' || pedido.DoneQty === null || pedido.DoneQty === undefined || pedido.DoneQty === '') ? 0 : pedido.DoneQty}</div></div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--narrow"><span>${getTranslation('card_label_sub_omega')}</span><div>${pedido.Beam || ''}</div></div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--micro"><span>${getTranslation('card_label_sub_omega_qty')}</span><div>${formatComponentQuantity(pedido.BeamQty)}</div></div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--narrow">
              <span>${getTranslation('card_label_wall_int')}</span>
              <div>${ifValue}</div>
            </div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--micro"><span>${getTranslation('card_label_wall_int_qty')}</span><div>${formatComponentQuantity(pedido.IFQty)}</div></div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--narrow"><span>${getTranslation('card_label_extender')}</span><div>${pedido.Extender || '-'}</div></div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--micro"><span>${getTranslation('card_label_extender_qty')}</span><div>${formatExtenderQuantity(extQty)}</div></div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--micro"><span>${getTranslation('card_label_label_qty')}</span><div>${formatOptionalQuantity(pedido.PitBracketQty)}</div></div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--date"><span>${getTranslation('card_label_delivery_date')}</span><div>${pedido.DeliveryDate ? formatDate(pedido.DeliveryDate) : ''}</div></div>
            <div class="pedido-info-container trace-card-cell trace-card-cell--wide">
              <span>${getTranslation('card_label_wo')}</span>
              <div>${(pedido.WO || '').replace(/,/g, ', ')}</div>
            </div>
            <div class="pedido-info-container trace-card-cell trace-card-barcode">
              <span>${getTranslation('barcode_label')}</span>
              <div class="trace-card-barcode-frame">
                <img id="${imgId}" class="trace-card-barcode-image" alt="barcode" src="" />
              </div>
            </div>
            </div>
          </div>
        `;
      };

      // ---- Secondary compartido (usa el primer item con datos de TB; componentes a nivel de pedido) ----
      const secondaryRef = itemsArr.find(i => {
        const tb = String(i.TieBracket || '').trim();
        return !!(tb || (i.TieBracketQty !== null && i.TieBracketQty !== undefined) || (i.TieExtenderQty !== null && i.TieExtenderQty !== undefined));
      }) || headerRef;
      const tieBracket = String(secondaryRef.TieBracket || '').trim();
      const hasTieRowData = !!(
        tieBracket
        || secondaryRef.TieBracketQty !== null && secondaryRef.TieBracketQty !== undefined
        || secondaryRef.TieExtenderQty !== null && secondaryRef.TieExtenderQty !== undefined
      );
      const secondaryHtml = hasTieRowData ? `
        <div class="trace-card-secondary trace-card-secondary--shared">
          <div class="pedido-info-container trace-card-secondary-cell trace-card-secondary-cell--wide"><span>${getTranslation('card_label_tie_bracket')}</span><div>${tieBracket || '-'}</div></div>
          <div class="pedido-info-container trace-card-secondary-cell trace-card-secondary-cell--compact"><span>${getTranslation('card_label_qty')}</span><div>${formatOptionalQuantity(secondaryRef.TieBracketQty)}</div></div>
          <div class="pedido-info-container trace-card-secondary-cell trace-card-secondary-cell--wide"><span>${getTranslation('card_label_extender')}</span><div>${secondaryRef.Extender || '-'}</div></div>
          <div class="pedido-info-container trace-card-secondary-cell trace-card-secondary-cell--compact"><span>${getTranslation('card_label_extender_qty')}</span><div>${formatOptionalQuantity(secondaryRef.TieExtenderQty)}</div></div>
        </div>
      ` : '';

      const bodyItems = [...itemsArr].sort((a, b) => {
        const order = { W: 0, C: 1 };
        return (order[a.tipo] ?? 2) - (order[b.tipo] ?? 2);
      });

      card.innerHTML = `
        ${cornerHtml}
        ${headerHtml}
        <div class="trace-card-body trace-card-body--combined">
          ${bodyItems.map(p => buildBodyHtml(p)).join('')}
        </div>
        ${secondaryHtml}
      `;

      // ---- Barcodes ----
      itemsArr.forEach((pedido) => {
        let firstWO = '';
        if (pedido.WO) {
          const woArr = String(pedido.WO).split(',').map(w => w.trim()).filter(w => w);
          if (woArr.length > 0) firstWO = woArr[0];
        }
        const imgId = `barcodeimg_${idx}_${pedido.tipo}_${String(pedido.SalesOrder || '').replace(/[^a-zA-Z0-9]/g, '')}`;
        const img = card.querySelector(`#${imgId}`);
        if (img) {
          img.dataset.barcodeValue = firstWO;
          img.src = firstWO ? buildBarcodeUrl(firstWO) : '';
        }
      });

      return card;
    }

    async function renderCards(pedidos, options = {}) {
      const { force = false } = options;
      const sorted = Array.isArray(pedidos) ? [...pedidos] : [];
      const nextSignature = buildPedidosSignature(sorted);

      if (!force && nextSignature === lastRenderedPedidosSignature) {
        return;
      }

      lastRenderedPedidosSignature = nextSignature;
      pedidosCache = sorted;
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      if (!sorted.length) {
        const vacio = document.createElement('div');
        vacio.textContent = getTranslation('text_no_cw_orders');
        vacio.style.textAlign = 'center';
        vacio.style.color = '#3456a1';
        vacio.style.marginTop = '40px';
        grid.appendChild(vacio);
        return;
      }

      const groups = groupBySalesOrder(sorted);
      let idxCounter = 0;

      for (const group of groups) {
        // Siempre usamos la tarjeta combinada: filas coloreadas por tipo (C verde / W gris)
        // y fila inferior compartida, tanto si hay C+W como si hay solo uno.
        grid.appendChild(buildCombinedCard(group.items, idxCounter++));
      }
    }

    function setupPageLogic() {
        let autoUpdateInFlight = false;

        async function autoUpdate() {
            // La consulta C/W puede tardar más que el intervalo de refresco.
            // No iniciar otra pareja de peticiones mientras la anterior está en curso:
            // de lo contrario cada pestaña acumula consultas SQL idénticas.
            if (document.hidden || autoUpdateInFlight) {
              return;
            }
            autoUpdateInFlight = true;
            try {
              const pedidos = await getPedidosCombinados();
              await renderCards(pedidos);
            } finally {
              autoUpdateInFlight = false;
            }
        }
        autoUpdate();
        setInterval(autoUpdate, VIEW_REFRESH_INTERVAL_MS);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) {
            autoUpdate();
          }
        });
    }
  </script>

  <!-- ======================= INICIO DEL SCRIPT DE TRADUCCIÓN ======================= -->
  <script>

      let currentTranslations = {};
      function getTranslation(key) { return currentTranslations[key] || key; }
      function applyTranslations(translations) {
          currentTranslations = translations;
          document.querySelectorAll('[data-translate-key]').forEach(el => { if (translations[el.getAttribute('data-translate-key')]) el.innerHTML = translations[el.getAttribute('data-translate-key')]; });
          document.querySelectorAll('[data-translate-key-title]').forEach(el => { if (translations[el.getAttribute('data-translate-key-title')]) el.setAttribute('title', translations[el.getAttribute('data-translate-key-title')]); });
      }
      async function loadTranslations(lang) {
          try {
              const response = await fetch(`/translations/translation_${lang}.json`);
              if (!response.ok) { if (lang !== 'es') await loadTranslations('es'); return; }
              const translations = await response.json();
              applyTranslations(translations);
              document.documentElement.lang = lang;
              localStorage.setItem('language', lang);
              // Sincronizar ambos selectores
              const selector = document.getElementById('language-selector');
              const headerSelector = document.getElementById('header-language-selector');
              if (selector) selector.value = lang;
              if (headerSelector) headerSelector.value = lang;
          } catch (error) { console.error("Error al cargar traducciones:", error); }
      }
      function changeLanguage(lang) {
          loadTranslations(lang).then(async () => {
              // Re-renderizar las tarjetas con el nuevo idioma usando la caché de datos
              if (typeof renderCards === 'function' && typeof pedidosCache !== 'undefined') {
                  await renderCards(pedidosCache, { force: true });
              }
          });
      }
      document.addEventListener('DOMContentLoaded', () => {
          const lang = localStorage.getItem('language') || navigator.language.split('-')[0] || 'es';
          loadTranslations(lang).then(() => {
              if (typeof setupPageLogic === 'function') {
                  setupPageLogic();
              }
          });
      });
  </script>
